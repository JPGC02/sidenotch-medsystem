<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SideNotch — Notch</title>
<style>
  :root { --bg: rgba(10,10,12,.96); --bg2: rgba(255,255,255,.06); --bg3: rgba(255,255,255,.1); --fg: #f3f3f5; --muted: #8f8f98; --line: rgba(255,255,255,.08);
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --info: #60a5fa; --acc: #a78bfa; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  #root { position: relative; width: 100%; height: 100%; }
  #hit { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 380px; height: 34px; }

  #pill { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: var(--bg); color: var(--fg);
    border-radius: 0 0 18px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.06);
    width: 240px; height: 30px; overflow: visible; transition: width .25s cubic-bezier(.2,.8,.2,1), height .25s cubic-bezier(.2,.8,.2,1), border-radius .25s; }
  #clip { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
  body.open #pill { border-radius: 0 0 28px 28px; }
  /* mordidas côncavas: fundem a pastilha com a borda superior da tela */
  #pill::before, #pill::after { content: ""; position: absolute; top: 0; width: 18px; height: 18px; pointer-events: none; transition: width .25s, height .25s; }
  #pill::before { left: -18px; background: radial-gradient(circle at 0 100%, transparent 17.5px, var(--bg) 18px); }
  #pill::after  { right: -18px; background: radial-gradient(circle at 100% 100%, transparent 17.5px, var(--bg) 18px); }
  body.open #pill::before, body.open #pill::after { width: 26px; height: 26px; }
  body.open #pill::before { left: -26px; background: radial-gradient(circle at 0 100%, transparent 25.5px, var(--bg) 26px); }
  body.open #pill::after  { right: -26px; background: radial-gradient(circle at 100% 100%, transparent 25.5px, var(--bg) 26px); }
  body.alert #pill { box-shadow: 0 0 0 2px var(--warn), 0 8px 30px rgba(0,0,0,.55); }

  /* estado fechado */
  #mini { position: absolute; inset: 0; height: 30px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 14px; font-size: 11.5px; white-space: nowrap; transition: opacity .15s; }
  body.open #mini { opacity: 0; pointer-events: none; }
  #mini .seg { display: flex; align-items: center; gap: 6px; color: #d8d8dd; }
  #mini .seg svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
  #mini .track { max-width: 130px; overflow: hidden; }
  #mini .track span { display: inline-block; padding-left: 0; }
  #mini .track.scroll span { animation: marquee 9s linear infinite; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(calc(-100% + 130px)); } }
  #mini .bar { width: 26px; height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; } #mini .bar i { display: block; height: 100%; }
  #mini .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  #mini .clock b { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .3px; } #mini .wi { font-size: 13px; }
  #mini .dot.playing { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .35; } }

  /* estado aberto */
  #panel { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; opacity: 0; transition: opacity .2s .05s; }
  body.open #panel { opacity: 1; }
  #tabs { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px 12px 6px; }
  .tab { width: 38px; height: 32px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--muted); position: relative; }
  .tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .tab:hover { background: var(--bg2); color: var(--fg); } .tab.on { background: var(--bg3); color: var(--fg); }
  .tab .cnt { position: absolute; top: 2px; right: 3px; min-width: 14px; height: 14px; border-radius: 7px; background: var(--warn); color: #1a1200; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
  #tabs .sp { flex: 1; } #tabs .clock { font-size: 12px; color: var(--muted); padding: 0 8px; font-variant-numeric: tabular-nums; }
  #view { flex: 1; overflow: auto; padding: 6px 18px 16px; scrollbar-width: none; max-height: 500px; } #view::-webkit-scrollbar { display: none; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 8px 0 8px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 11.5px; }
  button { border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg3); color: var(--fg); }
  button:hover { background: rgba(255,255,255,.16); } button.pri { background: var(--acc); color: #120a2a; } button.icon { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  button.icon svg { width: 16px; height: 16px; fill: currentColor; }
  input, textarea { background: rgba(0,0,0,.35); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font: inherit; font-size: 12.5px; user-select: text; }
  input:focus, textarea:focus { outline: 1px solid var(--acc); }
  .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--info); border-radius: 3px; transition: width .4s; }
  .spark { width: 100%; height: 34px; display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  #instGrid { max-height: 232px; overflow: auto; scrollbar-width: none; padding-bottom: 2px; } #instGrid::-webkit-scrollbar { display: none; }
  .app { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; text-align: center; }
  .app:hover { background: var(--bg3); } .app img { width: 34px; height: 34px; border-radius: 9px; object-fit: contain; } .app .nm { font-size: 11px; line-height: 1.2; max-height: 27px; overflow: hidden; }
  .app .x { position: absolute; top: 4px; right: 7px; color: var(--muted); font-size: 13px; display: none; } .app:hover .x { display: block; } .app .x:hover { color: var(--bad); }
  .app .pin { position: absolute; top: 3px; left: 7px; color: var(--muted); font-size: 12px; display: none; } .app:hover .pin { display: block; } .app.pinned .pin { display: block; color: var(--warn); }
  .app.add { border-style: dashed; color: var(--muted); justify-content: center; }
  /* música */
  .music { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; }
  .art { width: 104px; height: 104px; border-radius: 20px; background: linear-gradient(135deg, #2a1e4d, #0f2a3d); display: grid; place-items: center; color: var(--acc); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mini .cover { width: 18px; height: 18px; border-radius: 5px; object-fit: cover; }
  .art svg { width: 40px; height: 40px; fill: currentColor; }
  .art.playing { animation: glow 3s ease-in-out infinite; } @keyframes glow { 50% { box-shadow: 0 0 28px rgba(167,139,250,.35); } }
  .title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .artist { color: #c9c9cf; font-size: 13px; margin-top: 2px; }
  .ctrls { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .time { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  /* notas */
  .notes { display: grid; grid-template-columns: 180px 1fr; gap: 12px; height: 330px; }
  .nlist { overflow: auto; display: flex; flex-direction: column; gap: 4px; }
  .nitem { padding: 8px 10px; border-radius: 10px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .nitem:hover { background: var(--bg2); } .nitem.on { background: var(--bg3); }
  .notes textarea { width: 100%; height: 100%; resize: none; line-height: 1.5; font-size: 13px; }
  .npane { display: flex; flex-direction: column; gap: 6px; min-height: 0; } .npane textarea { flex: 1; height: auto; }
  .ck { display: flex; flex-direction: column; gap: 4px; overflow: auto; flex: 1; }
  .ci { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; background: var(--bg2); }
  .ci input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--ok); flex: 0 0 16px; }
  .ci input[type=text] { flex: 1; background: transparent; border: 0; padding: 2px 0; }
  .ci.done input[type=text] { text-decoration: line-through; color: var(--muted); }
  .ci .x { color: var(--muted); cursor: pointer; padding: 0 4px; } .ci .x:hover { color: var(--bad); }
  .seg { display: inline-flex; background: var(--bg2); border-radius: 9px; padding: 2px; } .seg button { padding: 4px 10px; font-size: 11px; background: transparent; } .seg button.on { background: var(--bg3); }
  /* canvas */
  .cv { position: relative; height: 340px; border-radius: 14px; overflow: hidden; background: radial-gradient(rgba(255,255,255,.08) 1px, transparent 1px) 0 0 / 20px 20px, rgba(0,0,0,.35); border: 1px solid var(--line); cursor: grab; }
  .cv.tool-text, .cv.tool-arrow { cursor: crosshair; }
  .cv .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .cv .it { position: absolute; cursor: move; border-radius: 8px; }
  .cv .it.sel { outline: 2px solid var(--acc); }
  .cv .it.text { padding: 6px 8px; background: rgba(250,240,150,.92); color: #1a1a1a; min-width: 60px; font-size: 13px; user-select: text; white-space: pre-wrap; }
  .cv .it.image img { display: block; max-width: none; border-radius: 8px; pointer-events: none; }
  .cv svg.arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .cvbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .cvbar .board { padding: 5px 10px; border-radius: 8px; background: var(--bg2); font-size: 12px; cursor: pointer; } .cvbar .board.on { background: var(--acc); color: #120a2a; }
  .cvbar button.on { background: var(--acc); color: #120a2a; }
  /* calendário */
  .week { display: grid; grid-template-columns: 64px repeat(8, 1fr); align-items: end; gap: 6px; padding: 6px 0 12px; }
  .week .mon { font-size: 26px; font-weight: 800; } .week .d { text-align: center; } .week .d .wd { font-size: 10px; color: var(--muted); font-weight: 700; } .week .d .n { font-size: 20px; font-weight: 700; color: #9a9aa3; }
  .week .d { cursor: pointer; border-radius: 10px; padding: 4px 0; } .week .d:hover { background: var(--bg2); }
  .week .d.today .n { color: var(--info); } .week .d.sel .wd { color: var(--fg); } .week .d.sel { background: var(--bg3); } .week .d.we .n { color: #c98e8e; }
  .week .d .dots { height: 6px; display: flex; justify-content: center; gap: 2px; } .week .d .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--acc); }
  .ev { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); } .ev:first-child { border-top: 0; }
  .ev .c { width: 4px; align-self: stretch; border-radius: 2px; } .ev .t { font-size: 11.5px; color: var(--muted); width: 88px; font-variant-numeric: tabular-nums; } .ev .s { font-size: 13px; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 22px 0; font-size: 13px; }
  .empty svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.6; display: block; margin: 0 auto 6px; }
  /* hub — estilo Apple: listas agrupadas, tiles, campo de busca arredondado */
  :root { --blue: #0a84ff; --teal: #64d2ff; --sep: rgba(255,255,255,.08); --fill: rgba(118,118,128,.22); --fill2: rgba(118,118,128,.34); }
  .hubhead { display: flex; align-items: center; gap: 12px; padding: 2px 2px 10px; }
  .hubhead .av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #5e5ce6, #0a84ff); display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 14px; box-shadow: 0 4px 12px rgba(10,132,255,.3); }
  .hubhead .nm { font-size: 15px; font-weight: 700; letter-spacing: -.2px; } .hubhead .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .rt { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; margin-right: 5px; } .rt.on { background: #30d158; box-shadow: 0 0 6px #30d158; } .rt.error { background: #ff453a; }
  .pillbtn { border-radius: 999px; padding: 6px 13px; font-size: 12px; font-weight: 600; background: var(--fill); display: inline-flex; align-items: center; gap: 6px; }
  .pillbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; flex: 0 0 15px; } .pillbtn:hover { background: var(--fill2); } .pillbtn.blue { background: var(--blue); color: #fff; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--fill); border-radius: 12px; padding: 0 12px; height: 36px; margin-bottom: 12px; }
  .search svg { width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; flex: 0 0 15px; }
  .search input { flex: 1; background: transparent; border: 0; padding: 0; font-size: 13.5px; } .search input:focus { outline: 0; } .search kbd { font-size: 10px; color: var(--muted); background: rgba(255,255,255,.08); border-radius: 5px; padding: 1px 5px; }
  .tiles { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px 6px; margin-bottom: 14px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; padding: 4px 2px; border-radius: 14px; }
  .tile:hover { background: rgba(255,255,255,.05); } .tile.k { background: rgba(10,132,255,.18); }
  .tile .ic { width: 50px; height: 50px; border-radius: 15px; display: grid; place-items: center; font-size: 24px; background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05)); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 4px 10px rgba(0,0,0,.35); position: relative; }
  .tile.form .ic { background: linear-gradient(160deg, #1f6feb, #0a84ff); } .tile.pinned .ic::after { content: ""; position: absolute; right: 5px; top: 5px; width: 6px; height: 6px; border-radius: 50%; background: #ffd60a; }
  .tile .nm { font-size: 10.5px; text-align: center; line-height: 1.15; max-width: 76px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #e5e5ea; }
  .glist { background: rgba(255,255,255,.055); border-radius: 16px; overflow: hidden; }
  .grow-item { display: flex; align-items: center; gap: 11px; padding: 10px 14px; cursor: pointer; position: relative; }
  .grow-item + .grow-item::before { content: ""; position: absolute; left: 44px; right: 0; top: 0; height: 1px; background: var(--sep); }
  .grow-item:hover { background: rgba(255,255,255,.05); }
  .grow-item .lead { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; background: var(--fill); flex: 0 0 30px; }
  .grow-item .ti { font-size: 13px; font-weight: 600; letter-spacing: -.1px; } .grow-item .ms { font-size: 11.5px; color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .grow-item .ag { font-size: 10.5px; color: var(--muted); white-space: nowrap; margin-left: auto; padding-left: 8px; }
  .grow-item.read { opacity: .6; } .grow-item .udot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); flex: 0 0 8px; } .grow-item.read .udot { visibility: hidden; }
  .chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: rgba(100,210,255,.16); color: var(--teal); letter-spacing: .2px; }
  .chip.late { background: rgba(255,69,58,.18); color: #ff6961; } .chip.pr-urgent { background: rgba(255,69,58,.18); color: #ff6961; } .chip.pr-high { background: rgba(255,159,10,.18); color: #ffb340; } .chip.pr-medium { background: rgba(255,214,10,.14); color: #ffd60a; } .chip.pr-low { background: rgba(10,132,255,.16); color: #6fb3ff; }
  .tk-actions { display: flex; gap: 6px; margin-left: auto; } .tk-actions button { border-radius: 999px; width: 30px; height: 30px; padding: 0; display: grid; place-items: center; font-size: 13px; background: var(--fill); }
  .tk-actions button.ok { background: rgba(48,209,88,.2); color: #30d158; } .tk-actions button:hover { background: var(--fill2); }
  .segc { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 2px; gap: 2px; } .segc button { border-radius: 8px; padding: 5px 14px; font-size: 12px; background: transparent; color: #d1d1d6; } .segc button.on { background: rgba(99,99,102,.95); color: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .sec-h { font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 10px 4px 6px; display: flex; justify-content: space-between; align-items: center; }
  .sec-h a { cursor: pointer; color: var(--blue); text-transform: none; letter-spacing: 0; font-size: 12px; }
  .lst { max-height: 320px; overflow: auto; scrollbar-width: none; } .lst::-webkit-scrollbar { display: none; }
  .login { max-width: 340px; margin: 14px auto; display: flex; flex-direction: column; gap: 10px; } .login input { width: 100%; border-radius: 12px; background: var(--fill); border: 0; padding: 10px 12px; font-size: 13.5px; }
  .login .logo { width: 56px; height: 56px; border-radius: 16px; margin: 0 auto 6px; background: linear-gradient(145deg, #5e5ce6, #0a84ff); display: grid; place-items: center; font-size: 26px; box-shadow: 0 8px 20px rgba(10,132,255,.35); }
  /* conversas (WhatsApp) */
  .ch-av { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(145deg, #25d366, #128c7e); display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 13px; flex: 0 0 38px; overflow: hidden; } .ch-av img { width: 100%; height: 100%; object-fit: cover; }
  .ch-un { min-width: 20px; height: 20px; border-radius: 10px; background: #25d366; color: #05240f; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
  .chip.tr { background: rgba(255,159,10,.2); color: #ffb340; } .chip.me { background: rgba(37,211,102,.16); color: #4ade80; } .chip.free { background: rgba(255,255,255,.1); color: #d1d1d6; }
  .tform { background: rgba(255,255,255,.055); border-radius: 16px; padding: 12px; display: grid; grid-template-columns: 1fr 140px 120px; gap: 8px; margin-bottom: 10px; }
  .tform input, .tform select, .tform textarea { width: 100%; border-radius: 10px; background: var(--fill); border: 0; padding: 8px 10px; font-size: 13px; color: var(--fg); } .tform textarea { grid-column: 1 / -1; height: 54px; resize: none; }
  .tform .acts { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .bn-ic.wa { background: linear-gradient(145deg, #25d366, #128c7e); }
  /* banner (Dynamic Island) de notificação na pastilha fechada */
  body.banner #mini { height: 62px; padding: 0 16px; gap: 12px; justify-content: flex-start; }
  body.banner #pill { border-radius: 0 0 24px 24px; }
  .bn-ic { width: 36px; height: 36px; border-radius: 11px; background: linear-gradient(145deg, #5e5ce6, #0a84ff); display: grid; place-items: center; font-size: 18px; flex: 0 0 36px; }
  .bn { min-width: 0; flex: 1; white-space: normal; } .bn .t { font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .bn .m { font-size: 11.5px; color: #c7c7cc; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.25; }
  .bn-x { color: var(--muted); font-size: 16px; cursor: pointer; padding: 4px; } .bn-x:hover { color: var(--fg); }
  /* Iconsax: os paths já trazem stroke; aqui só tamanho e cor */
  .tile .ic svg { width: 26px; height: 26px; } .tile.form .ic svg { color: #fff; }
  .grow-item .lead svg { width: 17px; height: 17px; } .tk-actions button svg { width: 15px; height: 15px; } .search svg { width: 17px; height: 17px; stroke: none; }
  .bn-ic svg { width: 20px; height: 20px; color: #fff; } .login .logo svg { width: 30px; height: 30px; color: #fff; }
  .pillbtn svg { stroke: none; } a svg { width: 12px; height: 12px; vertical-align: -2px; } .tab svg { fill: none; stroke: none; width: 20px; height: 20px; }
  #mini .seg svg { stroke: none; width: 14px; height: 14px; } button.icon svg { fill: none; width: 18px; height: 18px; } .ctrls button.icon svg { fill: currentColor; }
  .empty svg { stroke: none; } .art svg { fill: none; color: var(--acc); }
  /* toques Apple no restante */
  .card { border-radius: 18px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.05); }
  button.pri { background: var(--blue); color: #fff; }
  /* sistema */
  .sys { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi { display: flex; justify-content: space-between; align-items: baseline; } .kpi b { font-size: 20px; font-weight: 700; }
</style>
</head>
<body>
<div id="root">
  <div id="hit"></div>
  <div id="pill"><div id="clip">
    <div id="mini"></div>
    <div id="panel"><div id="tabs"></div><div id="view"></div></div>
  </div></div>
</div>
<script src="iconsax.js"></script>
<script>
const api = window.sidenotch;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IX = window.IX || {};
const I = {
  music: IX.MusicPlaylist, sys: IX.Cpu, apps: IX.Category, notes: IX.Note, cal: IX.Calendar, hub: IX.Home2, chat: IX.Messages2, bell: IX.Notification, check: IX.TaskSquare, gear: IX.Setting2,
  play: IX.PlayBold, pause: IX.PauseBold, prev: IX.PreviousBold, next: IX.NextBold, note: IX.Music, cpu: IX.Cpu, calEmpty: IX.Calendar1,
  search: IX.SearchNormal1, trash: IX.Trash, left: IX.ArrowLeft2, right: IX.ArrowRight2, add: IX.Add, user: IX.User, wa: IX.Whatsapp, transfer: IX.ExportSquare, hospital: IX.Hospital, monitor: IX.Monitor, tick: IX.TickCircle, refresh: IX.Refresh, logout: IX.LogoutCurve
};
const ico = (name, cls = '') => `<span class="ix ${cls}">${IX[name] || ''}</span>`;
const TABS_ALL = [['hub', 'Medsystem Hub'], ['chat', 'Conversas (WhatsApp)'], ['notes', 'Tarefas e notas'], ['cal', 'Calendário'], ['apps', 'Apps'], ['music', 'Música'], ['sys', 'Sistema']];
let TABS = TABS_ALL;
const tabsForState = () => { TABS = TABS_ALL.filter(([id]) => id !== 'chat' || (hub && hub.linked && hub.hasWhatsapp)); if (!TABS.some((t) => t[0] === tab)) tab = 'hub'; };   // canvas desativado por enquanto
let settings = {}, sys = null, cal = null, wx = null, docs = { notes: [], boards: [] }, approvals = { pending: [], maestri: null }, tab = 'music', openTimer = null, pinned = false;
let installed = null, webapps = [], appQuery = '', loadingApps = false;
let hub = null, hubQ = '', hubBusy = '', notesMode = 'tasks', newTaskOpen = false;

const fmtB = (b) => b > 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b > 1e3 ? Math.round(b / 1e3) + ' KB' : Math.round(b) + ' B';
const fmtRate = (b) => b > 1e6 ? (b / 1e6).toFixed(1) + ' MB/s' : (b / 1e3).toFixed(0) + ' KB/s';
const fmtT = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const col = (p) => p >= 85 ? 'var(--bad)' : p >= 60 ? 'var(--warn)' : 'var(--ok)';
const hhmm = (t) => new Date(t).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

// posição estimada da música (o worker atualiza a cada 2 s)
function mediaPos(m) { if (!m) return 0; const p = m.position + (m.playing ? (Date.now() - m.at) / 1000 : 0); return Math.min(p, m.duration || p); }

// ---------- fechado ----------
function renderMini() {
  if (document.body.classList.contains('banner')) return;
  const box = $('#mini'); const sh = (settings.notch && settings.notch.show) || {};
  let h = '';
  const m = sys && sys.media;
  if (sh.music !== false && m) h += `<div class="seg">${m.art ? `<img class="cover" src="${m.art}">` : ''}<span class="dot ${m.playing ? 'playing' : ''}" style="background:${m.playing ? 'var(--ok)' : 'var(--muted)'}"></span><div class="track ${(m.title + m.artist).length > 24 ? 'scroll' : ''}"><span>${esc(m.title)}${m.artist ? ' — ' + esc(m.artist) : ''}</span></div></div>`;
  if (sh.system !== false && sys) h += `<div class="seg">${I.cpu}<span style="color:${col(sys.cpu)}">${sys.cpu}%</span><div class="bar"><i style="width:${sys.mem.percent}%;background:${col(sys.mem.percent)}"></i></div></div>`;
  if (sh.calendar !== false && cal && cal.next) { const min = Math.round((cal.next.start - Date.now()) / 60000); h += `<div class="seg">${I.cal}<span>${min < 60 ? min + ' min' : hhmm(cal.next.start)} · ${esc(cal.next.title.slice(0, 18))}</span></div>`; }
  const n = (approvals.pending || []).length + ((approvals.maestri && approvals.maestri.prompts) || []).length;
  if (n) h += `<div class="seg" style="color:var(--warn)">⚠ ${n}</div>`;
  if (sh.hub !== false && hub && hub.linked) { if (hub.unread) h += `<div class="seg" style="color:#6fb3ff">${I.bell}${hub.unread}</div>`; if (hub.tasks && hub.tasks.length) h += `<div class="seg" style="color:${hub.overdue ? 'var(--bad)' : '#d8d8dd'}">${I.check}${hub.tasks.length}</div>`; if (hub.chatUnread) h += `<div class="seg" style="color:#4ade80">${I.chat}${hub.chatUnread}</div>`; }
  if (sh.clock !== false) h = `<div class="seg clock"><b>${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</b></div>` + h;
  if (sh.weather !== false && wx && wx.ok) h += `<div class="seg" title="${esc(wx.desc || '')}${wx.label ? ' · ' + esc(wx.label) : ''}"><span class="wi">${wx.icon}</span>${wx.temp}°</div>`;
  if (!h) h = `<div class="seg muted">SideNotch</div>`;
  box.innerHTML = h;
  const w = Math.min(600, Math.max(220, box.scrollWidth + 20));
  if (!document.body.classList.contains('open')) $('#pill').style.width = w + 'px';
  document.body.classList.toggle('alert', n > 0);
}

// ---------- aberto ----------
function renderTabs() {
  tabsForState();
  const t = $('#tabs'); t.innerHTML = '';
  for (const [id, name] of TABS) { const d = document.createElement('div'); d.className = 'tab' + (tab === id ? ' on' : ''); d.title = name; d.innerHTML = (id === 'notes' ? I.check : I[id]) + (id === 'chat' && hub && hub.chatUnread ? `<span class="cnt" style="background:#25d366;color:#05240f">${hub.chatUnread}</span>` : '') + (id === 'notes' && hub && hub.linked && hub.overdue ? `<span class="cnt" style="background:#ff453a;color:#fff">${hub.overdue}</span>` : '') + (id === 'hub' && hub && hub.linked && hub.unread ? `<span class="cnt" style="background:#2dd4bf;color:#062a26">${hub.unread}</span>` : ''); d.onclick = () => { tab = id; renderTabs(); renderView(); }; t.appendChild(d); }
  t.insertAdjacentHTML('beforeend', `<div class="sp"></div><div class="clock">${new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })} · ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>`);
  const g = document.createElement('div'); g.className = 'tab'; g.innerHTML = I.gear; g.title = 'Configurações'; g.onclick = () => api.openSettings(); t.appendChild(g);
}

function renderView() {
  const v = $('#view');
  if (tab === 'hub') { v.innerHTML = viewHub(); bindHub(); }
  else if (tab === 'chat') { v.innerHTML = viewChat(); bindChat(); }
  else if (tab === 'music') v.innerHTML = viewMusic();
  else if (tab === 'sys') v.innerHTML = viewSys();
  else if (tab === 'apps') { v.innerHTML = viewApps(); bindApps(); }
  else if (tab === 'notes') { const seg = `<div class="row" style="margin-bottom:10px"><div class="segc"><button id="segTasks" class="${notesMode === 'tasks' ? 'on' : ''}">Tarefas${hub && hub.tasks && hub.tasks.length ? ' · ' + hub.tasks.length : ''}</button><button id="segNotes" class="${notesMode === 'notes' ? 'on' : ''}">Notas</button></div></div>`; if (notesMode === 'tasks') { v.innerHTML = seg + viewTasks(); bindTasks(); } else { v.innerHTML = seg + viewNotes(); bindNotes(); } $('#segTasks').onclick = () => { notesMode = 'tasks'; renderView(); }; $('#segNotes').onclick = () => { notesMode = 'notes'; renderView(); }; }
  else if (tab === 'canvas') { v.innerHTML = viewCanvas(); bindCanvas(); }
  else if (tab === 'cal') { v.innerHTML = viewCal(); bindCal(); }
  if (tab === 'music') bindMusic();
  requestAnimationFrame(fitPill);
}

// música
function viewMusic() {
  const m = sys && sys.media;
  if (!m) return `<div class="empty">${I.music}Nada tocando agora.<div class="muted" style="margin-top:4px">Spotify, YouTube, Chrome, VLC… qualquer player que apareça nos controles de mídia do Windows.</div></div>`;
  const pos = mediaPos(m), pct = m.duration ? pos / m.duration * 100 : 0;
  return `<div class="card music"><div class="art ${m.playing ? 'playing' : ''}">${m.art ? `<img src="${m.art}">` : I.note}</div><div class="grow">
      <div class="muted">${esc(m.app || '')}${m.album ? ' · ' + esc(m.album) : ''}</div>
      <div class="title" title="${esc(m.title)}">${esc(m.title)}</div><div class="artist">${esc(m.artist)}</div>
      <div class="row" style="margin-top:10px"><span class="time" id="mpos">${fmtT(pos)}</span><div class="bar grow"><i id="mbar" style="width:${pct}%;background:var(--acc)"></i></div><span class="time">${m.duration ? fmtT(m.duration) : '–:––'}</span></div>
      <div class="ctrls"><button class="icon" data-m="prev" ${m.canPrev ? '' : 'disabled'}>${I.prev}</button><button class="icon pri" data-m="toggle" style="width:42px;height:42px">${m.playing ? I.pause : I.play}</button><button class="icon" data-m="next" ${m.canNext ? '' : 'disabled'}>${I.next}</button></div>
    </div></div>`;
}
function bindMusic() { document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => api.media(b.dataset.m)); }
setInterval(() => { const m = sys && sys.media; const el = $('#mbar'); if (el && m && m.playing) { const pos = mediaPos(m); el.style.width = (m.duration ? pos / m.duration * 100 : 0) + '%'; $('#mpos').textContent = fmtT(pos); } }, 1000);

// sistema
function spark(arr, max, color) {
  if (!arr || arr.length < 2) return '';
  const mx = max || Math.max(...arr, 1);
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * 100).toFixed(1)},${(34 - v / mx * 30).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}
function viewSys() {
  if (!sys) return '<div class="empty">Coletando…</div>';
  const h = sys.history || {};
  const up = sys.uptime || 0, upS = `${Math.floor(up / 86400)}d ${Math.floor(up % 86400 / 3600)}h ${Math.floor(up % 3600 / 60)}m`;
  const w = wx && wx.ok ? `<div class="card" style="grid-column:1/-1;display:flex;align-items:center;gap:14px"><span style="font-size:30px">${wx.icon}</span><div class="grow"><div class="kpi"><span><b style="font-size:20px">${wx.temp}°C</b> <span class="muted">sensação ${wx.feels}°</span></div><span class="muted">${esc(wx.label || '')}</span></div><div class="muted">${esc(wx.desc || '')} · mín ${wx.min}° / máx ${wx.max}° · umidade ${wx.humidity}% · vento ${wx.wind} km/h</div></div>${(wx.days || []).slice(1, 3).map((d) => `<div style="text-align:center"><div class="muted">${new Date(d.date + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '')}</div><div>${d.icon}</div><div class="muted">${d.min}°/${d.max}°</div></div>`).join('')}</div>` : (wx && wx.error ? `<div class="muted" style="grid-column:1/-1">Clima indisponível: ${esc(wx.error)}</div>` : '');
  return `<div class="sys">${w}
    <div class="card"><div class="kpi"><span class="muted">CPU${sys.cores ? ' · ' + sys.cores + ' núcleos' : ''}</span><b style="color:${col(sys.cpu)}">${sys.cpu}%</b></div>${spark(h.cpu, 100, col(sys.cpu))}<div class="muted" style="font-size:10.5px">${esc(sys.cpuModel || '')}</div></div>
    <div class="card"><div class="kpi"><span class="muted">Memória</span><b style="color:${col(sys.mem.percent)}">${sys.mem.percent}%</b></div>${spark(h.mem, 100, col(sys.mem.percent))}<div class="muted" style="font-size:10.5px">${fmtB(sys.mem.used)} de ${fmtB(sys.mem.total)}</div></div>
    <div class="card"><div class="kpi"><span class="muted">Rede ↓</span><b>${fmtRate(sys.net.down)}</b></div>${spark(h.down, null, 'var(--info)')}<div class="kpi" style="margin-top:6px"><span class="muted">↑</span><span>${fmtRate(sys.net.up)}</span></div></div>
    <div class="card"><div class="muted" style="margin-bottom:6px">Discos</div>${(sys.disks || []).map((d) => `<div class="row" style="margin:4px 0"><span style="width:26px;font-weight:700">${esc(d.name)}</span><div class="bar grow"><i style="width:${d.percent}%;background:${col(d.percent)}"></i></div><span class="muted" style="width:120px;text-align:right">${fmtB(d.free)} livres</span></div>`).join('') || '<div class="muted">—</div>'}<div class="muted" style="margin-top:8px;font-size:10.5px">Ligado há ${upS}${sys.workerError ? ' · ' + esc(sys.workerError) : ''}</div></div>
  </div>`;
}

// apps
function viewApps() {
  const pins = new Set(settings.pinnedApps || []);
  const list = (installed || []).filter((a) => !appQuery || a.name.toLowerCase().includes(appQuery.toLowerCase()));
  const shown = appQuery ? list.slice(0, 24) : [...list.filter((a) => pins.has(a.id)), ...list.filter((a) => !pins.has(a.id))].slice(0, 18);
  return `<h3>Web apps</h3><div class="grid" id="webgrid">${webapps.map((w) => `<div class="app" data-w="${esc(w.id)}" title="${esc(w.url)}"><img src="${esc(w.icon || '')}" onerror="this.style.visibility='hidden'"><div class="nm">${esc(w.name)}</div><span class="x" data-x="${esc(w.id)}" title="Remover">×</span></div>`).join('')}<div class="app add" id="addWeb">+ Adicionar</div></div>
    <div id="addForm" class="row" style="margin-top:8px" hidden><input id="wName" placeholder="Nome" style="width:130px"><input id="wUrl" class="grow" placeholder="https://…"><button class="pri" id="wOk">Salvar</button></div>
    <div class="row" style="margin-top:14px"><h3 class="grow" style="margin:0">Instalados${installed ? ` <span class="muted" style="text-transform:none;letter-spacing:0">· ${installed.length}</span>` : ''}</h3><input id="appQ" placeholder="Buscar app…" value="${esc(appQuery)}" style="width:200px"></div>
    <div class="grid" id="instGrid" style="margin-top:8px">${installedGrid(shown, pins)}</div>`;
}
function installedGrid(shown, pins) {
  if (installed === null) return '<div class="muted" style="grid-column:1/-1">Carregando atalhos…</div>';
  return shown.map((a) => `<div class="app ${pins.has(a.id) ? 'pinned' : ''}" data-a="${esc(a.id)}" title="${esc(a.target || a.lnk)}${a.kind === 'folder' ? ' (pasta)' : ''}"><span class="pin" data-pin="${esc(a.id)}" title="Fixar">★</span>${a.icon ? `<img src="${a.icon}">` : '<div style="width:34px;height:34px;border-radius:9px;background:var(--bg3)"></div>'}<div class="nm">${a.kind === 'folder' ? '📁 ' : ''}${esc(a.name)}</div></div>`).join('') || '<div class="muted" style="grid-column:1/-1">Nada encontrado.</div>';
}
function bindInstalled() {
  document.querySelectorAll('[data-a]').forEach((el) => el.onclick = (e) => { if (e.target.dataset.pin) return; api.launchApp(el.dataset.a); });
  document.querySelectorAll('[data-pin]').forEach((el) => el.onclick = async (e) => { e.stopPropagation(); const p = new Set(settings.pinnedApps || []); p.has(el.dataset.pin) ? p.delete(el.dataset.pin) : p.add(el.dataset.pin); settings = await api.saveSettings({ pinnedApps: [...p] }); refreshInstalled(); });
}
function refreshInstalled() {
  const g = $('#instGrid'); if (!g) return;
  const pins = new Set(settings.pinnedApps || []);
  const list = (installed || []).filter((a) => !appQuery || a.name.toLowerCase().includes(appQuery.toLowerCase()));
  const shown = appQuery ? list.slice(0, 30) : [...list.filter((a) => pins.has(a.id)), ...list.filter((a) => !pins.has(a.id))].slice(0, 24);
  g.innerHTML = installedGrid(shown, pins); bindInstalled(); fitPill();
}
function bindApps() {
  document.querySelectorAll('[data-w]').forEach((el) => el.onclick = (e) => { if (e.target.dataset.x) return; api.openWebApp(el.dataset.w); });
  document.querySelectorAll('[data-x]').forEach((el) => el.onclick = async (e) => { e.stopPropagation(); webapps = webapps.filter((w) => w.id !== el.dataset.x); await api.setWebApps(webapps.map(({ id, name, url }) => ({ id, name, url }))); webapps = await api.listWebApps(); renderView(); });
  bindInstalled();
  const q = $('#appQ'); q.oninput = () => { appQuery = q.value; refreshInstalled(); };   // só a grade re-renderiza: o campo mantém foco e cursor
  $('#addWeb').onclick = () => { $('#addForm').hidden = false; api.setFocusable(true); $('#wName').focus(); };
  $('#wOk').onclick = async () => { const name = $('#wName').value.trim(), url = $('#wUrl').value.trim(); if (!name || !/^https?:\/\//.test(url)) return; webapps.push({ id: 'w' + Date.now().toString(36), name, url }); await api.setWebApps(webapps.map(({ id, name, url }) => ({ id, name, url }))); webapps = await api.listWebApps(); api.setFocusable(false); renderView(); };
  if (installed === null && !loadingApps) {
    loadingApps = true;
    const done = (l) => { installed = Array.isArray(l) ? l : []; loadingApps = false; if (tab === 'apps') { const q = $('#appQ'); const keep = q && document.activeElement === q; refreshInstalled(); const h = $('#view h3 .muted'); if (h) h.textContent = `· ${installed.length}`; if (keep) q.focus(); } };
    Promise.race([api.listApps(), new Promise((r) => setTimeout(() => r([]), 25000))]).then(done, () => done([]));
  }
}

// notas
let curNote = null, noteTimer = null;
function viewNotes() {
  if (!curNote || !docs.notes.find((n) => n.id === curNote)) curNote = docs.notes[0] && docs.notes[0].id;
  const n = docs.notes.find((x) => x.id === curNote) || {};
  const isCk = n.type === 'checklist';
  const items = n.items || [];
  const done = items.filter((i) => i.done).length;
  const icon = (x) => x.type === 'checklist' ? '☑ ' : '';
  return `<div class="notes"><div><div class="row" style="margin-bottom:6px"><button id="nAdd" class="grow">+ Nota</button><button id="nAddCk" class="grow" title="Nova lista de tarefas">+ Lista</button><button id="nDel" title="Apagar">${I.trash}</button></div><div class="nlist">${docs.notes.map((x) => `<div class="nitem ${x.id === curNote ? 'on' : ''}" data-n="${x.id}">${icon(x)}${esc(x.title || (x.text || '').split('\n')[0] || 'Sem título')}</div>`).join('')}</div></div>
    <div class="npane">
      <div class="row"><input id="nTitle" class="grow" placeholder="Título" value="${esc(n.title || '')}"><div class="seg"><button id="segT" class="${isCk ? '' : 'on'}">Texto</button><button id="segC" class="${isCk ? 'on' : ''}">Checklist</button></div></div>
      ${isCk ? `<div class="muted">${done}/${items.length} concluídas</div><div class="ck" id="ck">${items.map((it, i) => `<div class="ci ${it.done ? 'done' : ''}" data-i="${i}"><input type="checkbox" ${it.done ? 'checked' : ''}><input type="text" value="${esc(it.text)}" placeholder="Tarefa"><span class="x" title="Remover">×</span></div>`).join('')}</div><div class="row"><input id="ckNew" class="grow" placeholder="Nova tarefa… (Enter)"><button id="ckAdd">+</button></div>`
             : `<textarea id="nText" placeholder="Escreva aqui…">${esc(n.text || '')}</textarea>`}
    </div></div>`;
}
function bindNotes() {
  const cur = () => docs.notes.find((x) => x.id === curNote);
  document.querySelectorAll('[data-n]').forEach((el) => el.onclick = () => { curNote = el.dataset.n; renderView(); });
  const newNote = (type) => { const id = 'n' + Date.now().toString(36); docs.notes.unshift({ id, type, title: '', text: '', items: [], updatedAt: Date.now() }); curNote = id; saveDocs(); renderView(); api.setFocusable(true); setTimeout(() => { const f = $(type === 'checklist' ? '#ckNew' : '#nText'); f && f.focus(); }, 40); };
  $('#nAdd').onclick = () => newNote('text'); $('#nAddCk').onclick = () => newNote('checklist');
  $('#nDel').onclick = () => { docs.notes = docs.notes.filter((x) => x.id !== curNote); if (!docs.notes.length) docs.notes.push({ id: 'n' + Date.now().toString(36), type: 'text', title: '', text: '', items: [], updatedAt: Date.now() }); curNote = docs.notes[0].id; saveDocs(); renderView(); };
  const refreshList = () => { const n = cur(); document.querySelectorAll('[data-n]').forEach((el) => { if (el.dataset.n === curNote) el.textContent = (n.type === 'checklist' ? '☑ ' : '') + (n.title || (n.text || '').split('\n')[0] || 'Sem título'); }); };
  $('#nTitle').oninput = () => { const n = cur(); n.title = $('#nTitle').value.slice(0, 80); n.updatedAt = Date.now(); clearTimeout(noteTimer); noteTimer = setTimeout(() => { saveDocs(); refreshList(); }, 400); };
  $('#segT').onclick = () => { const n = cur(); if (n.type === 'checklist') { n.type = 'text'; if (!n.text && (n.items || []).length) n.text = n.items.map((i) => (i.done ? '[x] ' : '[ ] ') + i.text).join('\n'); saveDocs(); renderView(); } };
  $('#segC').onclick = () => { const n = cur(); if (n.type !== 'checklist') { n.type = 'checklist'; if (!(n.items || []).length && n.text) n.items = n.text.split('\n').filter(Boolean).map((l) => ({ text: l.replace(/^\[( |x)\]\s*/i, ''), done: /^\[x\]/i.test(l) })); n.items = n.items || []; saveDocs(); renderView(); } };
  const ta = $('#nText');
  if (ta) ta.oninput = () => { const n = cur(); if (!n) return; n.text = ta.value; if (!n.title) { /* título automático pela 1ª linha */ } n.updatedAt = Date.now(); clearTimeout(noteTimer); noteTimer = setTimeout(() => { saveDocs(); refreshList(); }, 400); };
  const ck = $('#ck');
  if (ck) {
    const n = cur();
    const add = () => { const v = $('#ckNew').value.trim(); if (!v) return; n.items.push({ text: v, done: false }); saveDocs(); renderView(); setTimeout(() => { api.setFocusable(true); $('#ckNew').focus(); }, 30); };
    $('#ckAdd').onclick = add; $('#ckNew').onkeydown = (e) => { if (e.key === 'Enter') add(); };
    ck.querySelectorAll('.ci').forEach((row) => {
      const i = Number(row.dataset.i), it = n.items[i];
      row.querySelector('input[type=checkbox]').onchange = (e) => { it.done = e.target.checked; row.classList.toggle('done', it.done); saveDocs(); const m = document.querySelector('.npane .muted'); if (m) m.textContent = `${n.items.filter((x) => x.done).length}/${n.items.length} concluídas`; };
      row.querySelector('input[type=text]').oninput = (e) => { it.text = e.target.value; clearTimeout(noteTimer); noteTimer = setTimeout(saveDocs, 400); };
      row.querySelector('.x').onclick = () => { n.items.splice(i, 1); saveDocs(); renderView(); };
    });
  }
}
function saveDocs() { api.setDocs({ notes: docs.notes, boards: docs.boards }); }

// canvas
let board = null, cvTool = 'select', sel = null, drag = null, arrowStart = null;
function curBoard() { if (!board || !docs.boards.find((b) => b.id === board)) board = docs.boards[0].id; return docs.boards.find((b) => b.id === board); }
function viewCanvas() {

  return `<div class="row" style="margin-bottom:8px"><span class="muted grow">Tarefas atribuídas a você e as OS do Fluxo da AT.</span><button class="pillbtn blue" id="ntNew">${I.add} Nova tarefa</button></div>${form}<div class="lst" style="max-height:${newTaskOpen ? 300 : 420}px">${tks.length ? grp('Atrasadas', late) + grp('Hoje', todayT) + grp('Próximas / sem prazo', rest) : '<div class="empty">Nada pendente 🎉</div>'}</div>
    <div class="muted" style="margin-top:8px;font-size:10.5px;text-align:center"><a id="hbTasks2" style="cursor:pointer;color:var(--blue)">Abrir central de tarefas no Hub</a>${hubBusy ? ' · ' + esc(hubBusy) : ''}</div>`;
}
function bindTasks() {
  const setHub = (r) => { if (r && r.state) hub = r.state; renderTabs(); renderView(); };
  document.querySelectorAll('[data-ts]').forEach((b) => b.onclick = async (e) => { e.stopPropagation(); const [id, st] = b.dataset.ts.split(/:(?=[a-z_]+$)/); b.disabled = true; const r = await api.hubTask(id, st); if (!r.ok) { hubBusy = r.error; renderView(); } else setHub(r); });
  document.querySelectorAll('[data-tk]').forEach((el) => el.onclick = () => api.hubOpen(el.dataset.tk || '/tarefas'));
  const t2 = $('#hbTasks2'); if (t2) t2.onclick = () => api.hubOpen('/tarefas');
  $('#ntNew').onclick = () => { newTaskOpen = !newTaskOpen; renderView(); if (newTaskOpen) setTimeout(() => { const f = $('#ntTitle'); if (f) { api.setFocusable(true); f.focus(); } }, 40); };
  const cancel = $('#ntCancel'); if (cancel) cancel.onclick = () => { newTaskOpen = false; api.setFocusable(false); renderView(); };
  const save = $('#ntSave');
  if (save) {
    const go = async () => { const title = $('#ntTitle').value.trim(); if (!title) { $('#ntMsg').textContent = 'Dê um título.'; return; } save.disabled = true; $('#ntMsg').textContent = 'Criando…'; const r = await api.hubCreateTask({ title, due_date: $('#ntDue').value || null, priority: $('#ntPri').value, description: $('#ntDesc').value.trim() }); if (!r.ok) { save.disabled = false; $('#ntMsg').textContent = r.error; return; } newTaskOpen = false; hub = r.state; api.setFocusable(false); renderTabs(); renderView(); };
    save.onclick = go; $('#ntTitle').onkeydown = (e) => { if (e.key === 'Enter') go(); if (e.key === 'Escape') cancel.click(); };
  }
}
// conversas do WhatsApp (Organizador de Contato)
function viewChat() {
  const list = (hub && hub.chats) || [];
  const ini = (n) => String(n || '?').replace(/[^\p{L}\d ]/gu, '').split(' ').filter(Boolean).slice(0, 2).map((x) => x[0]).join('').toUpperCase() || '#';
  const row = (c) => `<div class="grow-item" data-ch="${esc(c.id)}"><div class="ch-av">${c.avatar ? `<img src="${esc(c.avatar)}" onerror="this.remove()">` : esc(ini(c.name))}</div>
      <div class="grow" style="min-width:0"><div class="ti" style="display:flex;gap:6px;align-items:center"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>${c.transferred ? `<span class="chip tr">↪ de ${esc(c.transferredFrom || 'outro setor')}</span>` : ''}${c.mine ? '<span class="chip me">você</span>' : c.unassigned ? '<span class="chip free">sem atendente</span>' : ''}</div><div class="ms" style="-webkit-line-clamp:1">${esc(c.preview || '')}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="ag" style="margin:0;padding:0">${c.at ? ago(c.at) : ''}</span>${c.unread ? `<span class="ch-un">${c.unread}</span>` : ''}</div></div>`;
  const transfers = list.filter((c) => c.transferred && c.unassigned), rest = list.filter((c) => !transfers.includes(c));
  const grp = (name, arr) => arr.length ? `<div class="sec-h"><span>${name} · ${arr.length}</span></div><div class="glist">${arr.map(row).join('')}</div>` : '';
  return `<div class="row" style="margin-bottom:6px"><span class="muted grow">${hub.chatUnread ? `<b style="color:#4ade80">${hub.chatUnread}</b> mensagem(ns) não lida(s)` : 'Conversas abertas do seu setor'}</span><button class="pillbtn" id="chOpen">Abrir Organizador</button></div>
    <div class="lst" style="max-height:440px">${list.length ? grp('Transferidas para o setor — aguardando atendente', transfers) + grp('Conversas', rest) : '<div class="empty">Nenhuma conversa aberta</div>'}</div>`;
}
function bindChat() {
  document.querySelectorAll('[data-ch]').forEach((el) => el.onclick = () => api.hubOpen('/contatos?conversa=' + el.dataset.ch));
  $('#chOpen').onclick = () => api.hubOpen('/contatos');
}
function bindHub() {
  const setHub = (r) => { if (r && r.state) hub = r.state; else if (r && r.linked !== undefined) hub = r; renderTabs(); renderView(); };
  const login = $('#hbLogin');
  if (login) {
    const go = async () => { const e = $('#hbEmail').value.trim(), pw = $('#hbPass').value; if (!e || !pw) return; login.disabled = true; login.textContent = 'Entrando…'; const r = await api.hubLogin(e, pw); if (!r.ok) { login.disabled = false; login.textContent = 'Entrar'; $('#hbMsg').textContent = r.error; } else setHub(r); };
    login.onclick = go; $('#hbPass').onkeydown = (e) => { if (e.key === 'Enter') go(); }; $('#hbEmail').onkeydown = (e) => { if (e.key === 'Enter') $('#hbPass').focus(); };
    return;
  }
  const q = $('#hbQ');
  q.oninput = () => { hubQ = q.value; const { shown, pins, q: qq } = hubTiles(); const box = document.querySelector('.tiles'); box.innerHTML = shown.map((s, i) => `<div class="tile ${s.kind} ${qq && i === 0 ? 'k' : ''} ${pins.has(s.id) ? 'pinned' : ''}" data-sc="${esc(s.id)}"><div class="ic">${IX[s.ix] || s.icon}</div><div class="nm">${esc(s.name)}</div></div>`).join('') || '<div class="muted" style="grid-column:1/-1">Nada encontrado</div>'; bindTiles(); fitPill(); };
  q.onkeydown = (e) => { if (e.key === 'Enter') { const k = document.querySelector('.tiles .tile'); if (k) k.click(); } if (e.key === 'Escape') { hubQ = ''; q.blur(); api.setFocusable(false); setOpen(false); } };
  const bindTiles = () => document.querySelectorAll('[data-sc]').forEach((el) => {
    el.onclick = () => { const s = hub.shortcuts.find((x) => x.id === el.dataset.sc); if (s) api.hubOpen(s.path); hubQ = ''; api.setFocusable(false); };
    el.oncontextmenu = async (e) => { e.preventDefault(); const p = new Set((settings.hub && settings.hub.pinned) || []); p.has(el.dataset.sc) ? p.delete(el.dataset.sc) : p.add(el.dataset.sc); settings = await api.saveSettings({ hub: { pinned: [...p] } }); renderView(); };
  });
  bindTiles();
  document.querySelectorAll('[data-nt]').forEach((el) => el.onclick = async () => { const id = el.dataset.nt; if (el.dataset.link) api.hubOpen(el.dataset.link, id); else { const r = await api.hubRead(id); setHub(r); } });
  const all = $('#hbAll'); if (all) all.onclick = async () => setHub(await api.hubRead('*'));
  $('#hbSite').onclick = () => api.hubOpen('/dashboard'); $('#hbTasks').onclick = () => { tab = 'notes'; notesMode = 'tasks'; renderTabs(); renderView(); };
  const hc = $('#hbChat'); if (hc) hc.onclick = () => { tab = 'chat'; renderTabs(); renderView(); };
  $('#hbSync').onclick = async () => { hubBusy = 'atualizando…'; renderView(); hub = await api.hubSync(); hubBusy = ''; renderTabs(); renderView(); };
  $('#hbOut').onclick = async () => { hub = await api.hubLogout(); renderTabs(); renderView(); };
}
// banner estilo Dynamic Island na pastilha fechada
let bannerTimer = null;
function showBanner(n) {
  if (document.body.classList.contains('open')) return;
  clearTimeout(bannerTimer);
  const box = $('#mini');
  const wa = n.type === 'chat';
  box.innerHTML = `<div class="bn-ic ${wa ? 'wa' : ''}">${wa ? (n.kind === 'transfer' ? I.transfer : n.kind === 'assign' ? I.user : I.wa) : I.bell}</div><div class="bn"><div class="t">${esc(n.title)}</div><div class="m">${esc(n.text || '')}</div></div><span class="bn-x" id="bnX">×</span>`;
  document.body.classList.add('banner');
  $('#pill').style.width = '460px'; $('#pill').style.height = '62px';
  box.onclick = (e) => { if (e.target.id === 'bnX') { hideBanner(); return; } api.hubOpen(n.link, n.hubNotifId); hideBanner(); };
  bannerTimer = setTimeout(hideBanner, 9000);
}
function hideBanner() { clearTimeout(bannerTimer); if (!document.body.classList.contains('banner')) return; document.body.classList.remove('banner'); $('#mini').onclick = null; $('#pill').style.height = ''; renderMini(); }

// ---------- sons (Web Audio; sem arquivos) ----------
let actx = null;
function tone(ctx, t0, freq, dur, vol, type = 'sine', slide = 0) {
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function playPreset(preset, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + 0.02, v = Math.max(0.02, vol);
    if (preset === 'pop') { tone(actx, t, 880, 0.12, v, 'sine'); tone(actx, t + 0.11, 1320, 0.16, v * 0.8, 'sine'); }
    else if (preset === 'message') { tone(actx, t, 1567, 0.09, v * 0.9, 'triangle'); tone(actx, t + 0.09, 2093, 0.14, v * 0.7, 'triangle'); }   // dois toques agudos, tipo app de mensagens
    else if (preset === 'bell') { tone(actx, t, 1760, 0.6, v, 'sine'); tone(actx, t, 3520, 0.35, v * 0.25, 'sine'); tone(actx, t + 0.004, 2637, 0.4, v * 0.15, 'sine'); }
    else if (preset === 'soft') { tone(actx, t, 523, 0.35, v * 0.7, 'sine', 120); }
    else if (preset === 'chime') { [523, 659, 784].forEach((f, i) => tone(actx, t + i * 0.12, f, 0.35, v * 0.8, 'sine')); }
    else tone(actx, t, 880, 0.15, v, 'sine');
  } catch { /* sem áudio */ }
}
function playSound(d) {
  if (!d) return;
  if (d.preset === 'file' && d.file) { try { const a = new Audio(d.file.startsWith('file:') ? d.file : 'file:///' + d.file.replace(/\\/g, '/')); a.volume = d.volume ?? 0.6; a.play().catch(() => playPreset('pop', d.volume ?? 0.6)); } catch { playPreset('pop', d.volume ?? 0.6); } return; }
  playPreset(d.preset, d.volume ?? 0.6);
}

// ---------- abrir/fechar + click-through ----------
function typing() { const a = document.activeElement; return a && (/(INPUT|TEXTAREA)/.test(a.tagName) || a.isContentEditable); }
const SIZES = { hub: [760, 0], chat: [640, 0], music: [520, 0], sys: [640, 0], apps: [720, 0], notes: [700, 0], canvas: [760, 0], cal: [620, 0] };
function fitPill() {
  if (!document.body.classList.contains('open')) return;
  const w = (SIZES[tab] || [640])[0];
  const h = Math.min(548, $('#tabs').offsetHeight + $('#view').scrollHeight + 6);
  const pill = $('#pill'); pill.style.width = w + 'px'; pill.style.height = h + 'px';
}
function setOpen(v) {
  if (!v && (pinned || typing() || drag)) return;
  if (v && document.body.classList.contains('banner')) hideBanner();
  if (v && !document.body.classList.contains('open')) { renderTabs(); renderView(); }
  document.body.classList.toggle('open', v);
  if (v) fitPill(); else { $('#pill').style.height = ''; api.setFocusable(false); renderMini(); }
}
const root = $('#root');
root.addEventListener('mousemove', (e) => { const ui = e.target.closest('#pill, #hit'); api.setIgnoreMouse(!ui); if (ui) { clearTimeout(openTimer); setOpen(true); } });
document.addEventListener('mouseleave', () => { api.setIgnoreMouse(true); openTimer = setTimeout(() => setOpen(false), 350); });
root.addEventListener('mouseover', (e) => { if (!e.target.closest('#pill, #hit')) openTimer = setTimeout(() => setOpen(false), 350); });
document.addEventListener('focusout', () => setTimeout(() => { if (!typing()) api.setFocusable(false); }, 50));
// janela é não-focável por padrão (não rouba foco); ao clicar num campo, torna focável antes de o foco acontecer
document.addEventListener('mousedown', (e) => { const t = e.target; if (t && (/(INPUT|TEXTAREA)/.test(t.tagName) || t.isContentEditable)) { api.setFocusable(true); setTimeout(() => t.focus(), 30); } }, true);

(async () => {
  settings = await api.getSettings(); tab = (settings.notch && settings.notch.tab) || 'music'; if (!TABS.some((t) => t[0] === tab)) tab = 'music';
  hub = await api.hubGet(); sys = await api.getSystem(); cal = await api.getCalendar(); docs = await api.getDocs(); approvals = await api.getApprovals(); webapps = await api.listWebApps();
  renderMini();
  let musicKey = '';
  api.onSystem((s) => { sys = s; renderMini(); if (!document.body.classList.contains('open')) return; if (tab === 'sys') renderView(); if (tab === 'music') { const m = s.media; const k = m ? `${m.title}|${m.artist}|${m.playing}|${!!m.art}` : ''; if (k !== musicKey) { musicKey = k; renderView(); } } });
  api.onCalendar((c) => { cal = c; renderMini(); if (tab === 'cal' && document.body.classList.contains('open')) renderView(); });
  wx = await api.getWeather(); api.onWeather((w) => { wx = w; renderMini(); if (tab === 'sys' && document.body.classList.contains('open')) renderView(); });
  api.onSettings((s) => { settings = s; renderMini(); });
  api.onHub((h) => { const wasUnread = hub && hub.unread; hub = h; renderMini(); if (document.body.classList.contains('open')) { renderTabs(); if ((tab === 'hub' || tab === 'notes' || tab === 'chat') && !typing()) renderView(); }  });
  api.onSound(playSound);
  api.onNotify((n) => { if ((n.type === 'hub' || n.type === 'chat') && !(settings.dnd)) showBanner(n); });
  api.onNotchOpen((t) => { tab = t || 'hub'; renderTabs(); setOpen(true); renderView(); setTimeout(() => { const q = $('#hbQ'); if (q) { api.setFocusable(true); q.focus(); q.select(); } }, 60); });
  api.onApprovals((a) => { approvals = a; renderMini(); });
  api.onBar((w) => { if (w === 'blur') { const a = document.activeElement; if (a && a.blur) a.blur(); } });
  setInterval(() => { if (!document.body.classList.contains('open')) renderMini(); }, 20000);
  setInterval(() => { if (document.body.classList.contains('open')) { const c = document.querySelector('#tabs .clock'); if (c) c.textContent = `${new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })} · ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`; } }, 15000);
})();
