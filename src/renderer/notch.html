<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SideNotch — Notch</title>
<style>
  :root { --bg: rgba(10,10,12,.96); --bg2: rgba(255,255,255,.06); --bg3: rgba(255,255,255,.1); --fg: #f3f3f5; --muted: #8f8f98; --line: rgba(255,255,255,.08);
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444; --info: #60a5fa; --acc: #a78bfa; }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: var(--fg); }
  #root { position: relative; width: 100%; height: 100%; }
  #hit { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 380px; height: 34px; }

  #pill { position: absolute; top: 0; left: 50%; transform: translateX(-50%); background: var(--bg); color: var(--fg);
    border-radius: 0 0 18px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.06);
    width: 240px; height: 30px; overflow: visible; transition: width .25s cubic-bezier(.2,.8,.2,1), height .25s cubic-bezier(.2,.8,.2,1), border-radius .25s; }
  #clip { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; }
  body.open #pill { border-radius: 0 0 28px 28px; }
  /* mordidas côncavas: fundem a pastilha com a borda superior da tela */
  #pill::before, #pill::after { content: ""; position: absolute; top: 0; width: 18px; height: 18px; pointer-events: none; transition: width .25s, height .25s; }
  #pill::before { left: -18px; background: radial-gradient(circle at 0 100%, transparent 17.5px, var(--bg) 18px); }
  #pill::after  { right: -18px; background: radial-gradient(circle at 100% 100%, transparent 17.5px, var(--bg) 18px); }
  body.open #pill::before, body.open #pill::after { width: 26px; height: 26px; }
  body.open #pill::before { left: -26px; background: radial-gradient(circle at 0 100%, transparent 25.5px, var(--bg) 26px); }
  body.open #pill::after  { right: -26px; background: radial-gradient(circle at 100% 100%, transparent 25.5px, var(--bg) 26px); }
  /* alerta: contorno amarelo acompanhando a pastilha e as mordidas */
  body.alert #pill { box-shadow: inset 0 -2px 0 var(--warn), 0 8px 30px rgba(0,0,0,.55), 0 2px 14px rgba(245,158,11,.35); }
  body.alert #pill::before { background: radial-gradient(circle at 0 100%, transparent 17.5px, var(--warn) 18px, var(--warn) 20px, var(--bg) 20.5px); }
  body.alert #pill::after  { background: radial-gradient(circle at 100% 100%, transparent 17.5px, var(--warn) 18px, var(--warn) 20px, var(--bg) 20.5px); }
  body.alert.open #pill::before { background: radial-gradient(circle at 0 100%, transparent 25.5px, var(--warn) 26px, var(--warn) 28px, var(--bg) 28.5px); }
  body.alert.open #pill::after  { background: radial-gradient(circle at 100% 100%, transparent 25.5px, var(--warn) 26px, var(--warn) 28px, var(--bg) 28.5px); }

  /* foco: a linha de progresso azul percorre a base da pastilha e tinge as mordidas (mesmo truque do alerta) */
  /* foco: um traçado SVG segue a forma real da notch (mordidas + cantos) e o progresso percorre esse traçado */
  #fxsvg { position: absolute; top: 0; pointer-events: none; overflow: visible; opacity: 0; transition: opacity .2s; z-index: 3; }
  body.focusing #fxsvg { opacity: 1; }
  #fxsvg .trk { fill: none; stroke: rgba(255,255,255,.10); stroke-width: 2.5; }
  #fxsvg .run { fill: none; stroke: #0a84ff; stroke-width: 2.5; stroke-linecap: round; filter: drop-shadow(0 0 6px rgba(10,132,255,.7)); transition: stroke-dashoffset .9s linear, stroke .3s; }
  body.paused #fxsvg .run { stroke: #f59e0b; filter: drop-shadow(0 0 6px rgba(245,158,11,.6)); }
  body.focusing:not(.alert) #pill { box-shadow: 0 8px 30px rgba(0,0,0,.55), 0 2px 18px rgba(10,132,255,.22); }
  #mini .fx { color: #eaf3ff; font-weight: 700; } #mini .fx b { font-variant-numeric: tabular-nums; letter-spacing: .4px; font-size: 12.5px; }
  #mini .fx .nm { color: var(--muted); font-weight: 500; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mini .fx .st { color: #ff9f0a; font-weight: 700; }

  /* bandeja de arquivos */
  #drop { border: 1.5px dashed rgba(255,255,255,.18); border-radius: 16px; padding: 14px; text-align: center; color: var(--muted); font-size: 11.5px; margin-bottom: 10px; transition: background .15s, border-color .15s; }
  body.dragging #drop, body.dropmode #drop { border-color: var(--blue); background: rgba(10,132,255,.12); color: #cfe4ff; }
  body.dropmode #pill { box-shadow: inset 0 -2px 0 var(--blue), 0 8px 30px rgba(0,0,0,.55), 0 2px 18px rgba(10,132,255,.35); }
  .fitem { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--fill); cursor: grab; }
  .fitem:hover { background: var(--fill2); } .fitem.miss { opacity: .5; } .fitem.pin { box-shadow: inset 2px 0 0 #ffd60a; }
  .fico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: 0 0 34px; color: #fff; letter-spacing: .3px; }
  .fitem img.th { width: 34px; height: 34px; border-radius: 9px; object-fit: cover; flex: 0 0 34px; }
  .fnm { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fms { font-size: 10.5px; color: var(--muted); }
  .facts { display: flex; gap: 5px; } .facts button { width: 26px; height: 26px; padding: 0; border-radius: 50%; display: grid; place-items: center; } .facts button svg { width: 13px; height: 13px; }
  /* comandos do TI */
  .cgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .cbtn { display: flex; align-items: center; gap: 9px; padding: 10px; border-radius: 14px; background: var(--fill); cursor: pointer; border: 1px solid transparent; }
  .cbtn:hover { background: var(--fill2); border-color: rgba(255,255,255,.12); } .cbtn .ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 30px; color: #fff; }
  .cbtn .ic svg { width: 15px; height: 15px; } .cbtn .nm { font-size: 12px; font-weight: 600; } .cbtn .sub { font-size: 10px; color: var(--muted); }
  #cout { margin-top: 10px; background: rgba(0,0,0,.42); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; font-family: Consolas, "JetBrains Mono", monospace; font-size: 11px; white-space: pre-wrap; max-height: 260px; overflow: auto; color: #d7e2ee; }
  #cout .hd { display: flex; align-items: center; gap: 8px; font-family: inherit; color: var(--muted); margin-bottom: 6px; font-size: 10.5px; }
  #cout .err { color: #ff9f9a; }
  /* resposta rápida do WhatsApp */
  .reply { display: flex; gap: 6px; margin-top: 6px; }
  .reply input { flex: 1; min-width: 0; font-size: 12px; }
  .reply button { padding: 6px 10px; }

  /* Ideia Central: render rodando, ideia capturada e o que está para publicar */
  .icrow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--fill); margin-bottom: 6px; }
  .icrow:hover { background: var(--fill2); }
  .icrow .ic-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; flex: 0 0 30px; background: rgba(255,255,255,.06); color: #cfd2ff; }
  .icrow .ic-ic svg { width: 16px; height: 16px; }
  .icrow.run .ic-ic { background: rgba(94,92,230,.22); color: #b6b3ff; }
  .icrow.err .ic-ic { background: rgba(255,69,58,.2); color: #ff8b83; }
  .icrow.ok .ic-ic { background: rgba(48,209,88,.18); color: #6ee08a; }
  .icrow .t { font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icrow .s { font-size: 10.5px; color: var(--muted); }
  .icrow .grow { min-width: 0; }
  .icrow .tag2 { font-size: 10px; color: var(--muted); background: rgba(255,255,255,.07); border-radius: 6px; padding: 2px 6px; white-space: nowrap; }
  .icdot { width: 6px; height: 6px; border-radius: 50%; background: #5e5ce6; box-shadow: 0 0 8px rgba(94,92,230,.8); animation: pulse 1.6s ease-in-out infinite; flex: 0 0 6px; }
  .icacts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .icacts button { font-size: 11.5px; padding: 6px 10px; }
  .icnew { display: flex; gap: 6px; margin-bottom: 10px; }
  .icnew input { flex: 1; }
  #mini .ic-mini { color: #b6b3ff; font-weight: 700; }

  /* pausa do café: um cartão por pessoa, com trilho que anda e vira vermelho ao estourar */
  .cofs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 620px) { .cofs { grid-template-columns: 1fr; } }
  .cof { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; position: relative; overflow: hidden; }
  .cof.on { border-color: rgba(45,212,191,.45); background: linear-gradient(160deg, rgba(45,212,191,.12), rgba(255,255,255,.05)); }
  .cof.over { border-color: rgba(255,69,58,.5); background: linear-gradient(160deg, rgba(255,69,58,.14), rgba(255,255,255,.05)); }
  .cof .nm { font-size: 12.5px; font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 7px; }
  .cof .nm .dot { width: 7px; height: 7px; border-radius: 50%; background: #48484e; } .cof.on .nm .dot { background: #2dd4bf; box-shadow: 0 0 8px rgba(45,212,191,.7); animation: pulse 1.6s ease-in-out infinite; }
  .cof.over .nm .dot { background: #ff453a; box-shadow: 0 0 8px rgba(255,69,58,.7); }
  .cof .tm { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -1px; line-height: 1.1; margin: 6px 0 2px; }
  .cof.over .tm { color: #ff6b62; }
  .cof .sub { font-size: 11px; color: var(--muted); min-height: 15px; }
  .cof .trilho { height: 8px; border-radius: 999px; background: rgba(255,255,255,.08); margin: 12px 0 10px; overflow: hidden; position: relative; }
  .cof .trilho i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, #2dd4bf, #22c9e6); width: 0; transition: width .9s linear; box-shadow: 0 0 10px rgba(45,212,191,.5); }
  .cof.over .trilho i { background: linear-gradient(90deg, #ff453a, #ff9f0a); box-shadow: 0 0 10px rgba(255,69,58,.5); }
  .cof .acts { display: flex; gap: 6px; }
  .cof .acts button { flex: 1; font-size: 12px; padding: 7px 0; }
  .cof .acts .go { background: linear-gradient(180deg, #2ee0c6, #14b8a6); color: #04231f; font-weight: 700; }
  .cof .acts .stop { background: linear-gradient(180deg, #ff5c52, #e0342a); color: #fff; font-weight: 700; }
  .cof .hist { font-size: 10.5px; color: var(--muted); margin-top: 8px; display: flex; gap: 10px; flex-wrap: wrap; }
  .cof .hist b { color: #d8d8dd; font-variant-numeric: tabular-nums; }
  .coflist { margin-top: 12px; } .coflist .l { display: flex; align-items: center; gap: 8px; font-size: 11.5px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .coflist .l .p { font-weight: 600; min-width: 70px; } .coflist .l .t { font-variant-numeric: tabular-nums; } .coflist .l .ex { color: #ff9f9a; }
  .coflist .l .ag { margin-left: auto; color: var(--muted); font-size: 10px; }
  #mini .cof-mini { color: #2dd4bf; font-weight: 700; } #mini .cof-mini.over { color: #ff6b62; }

  /* quadro do time */
  .bkpis { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .bkpi { background: var(--bg2); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; min-width: 74px; }
  .bkpi b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; } .bkpi span { font-size: 10px; color: var(--muted); }
  .bkpi.warn b { color: #ff9f0a; } .bkpi.bad b { color: #ff453a; } .bkpi.ok b { color: #30d158; }
  .bgrid { display: grid; grid-template-columns: 1fr 300px; gap: 12px; align-items: start; }
  .brow { display: flex; align-items: center; gap: 7px; padding: 4px 0; }
  .bdot { width: 6px; height: 6px; border-radius: 50%; background: #48484e; flex: 0 0 6px; } .bdot.on { background: #30d158; box-shadow: 0 0 7px rgba(48,209,88,.7); }
  .bav { width: 22px; height: 22px; border-radius: 50%; background: var(--bg3); display: grid; place-items: center; font-size: 9.5px; font-weight: 700; flex: 0 0 22px; }
  .bnm { font-size: 11.5px; font-weight: 600; } .bst { font-size: 10px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bwip { font-size: 10px; background: var(--bg3); border-radius: 999px; padding: 1px 6px; } .bwip.over { background: rgba(255,159,10,.25); color: #ffd79a; }
  .btravas { display: flex; flex-direction: column; gap: 4px; }
  .btrava { background: rgba(255,159,10,.12); border: 1px solid rgba(255,159,10,.28); border-radius: 10px; padding: 5px 9px; font-size: 11px; }
  .btrava.bad { background: rgba(255,69,58,.12); border-color: rgba(255,69,58,.3); color: #ffc4bf; }
  .btravas { display: flex; flex-direction: row; flex-wrap: wrap; gap: 6px; } .btravas .btrava { flex: 0 1 auto; min-width: 160px; }
  .bfeed { display: flex; flex-direction: column; gap: 2px; max-height: 330px; overflow: auto; scrollbar-width: none; } .bfeed::-webkit-scrollbar { display: none; }
  .bev { display: flex; gap: 6px; align-items: baseline; font-size: 11px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.04); line-height: 1.3; }
  .btm { font-size: 9.5px; color: var(--muted); margin-left: auto; white-space: nowrap; }

  /* To Do + Journey Streak (foco) */
  .fxgrid { display: grid; grid-template-columns: 1fr 300px; gap: 12px; align-items: start; }
  @media (max-width: 780px) { .fxgrid { grid-template-columns: 1fr; } }
  .fxnow { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, rgba(10,132,255,.16), rgba(10,132,255,.05)); border: 1px solid rgba(10,132,255,.3); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; }
  .fxnow .tm { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.5px; }
  .fxnow .nm { font-size: 12px; color: #d8d8dd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fxnow .sub { font-size: 10.5px; color: var(--muted); }
  .fxring { position: relative; width: 34px; height: 34px; flex: 0 0 34px; }
  .fxring svg { transform: rotate(-90deg); } .fxring circle { fill: none; stroke-width: 3.2; }
  .fxbtn { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; padding: 0; flex: 0 0 30px; }
  .fxbtn.play { background: var(--blue); color: #fff; } .fxbtn.pause { background: #ff453a; color: #fff; } .fxbtn svg { width: 14px; height: 14px; }
  .streak { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .streak .hd { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: #d8d8dd; margin-bottom: 10px; } .streak .hd svg { width: 14px; height: 14px; } .streak .hd .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; gap: 3px; }
  .heat i { width: 11px; height: 11px; border-radius: 3px; background: rgba(255,255,255,.07); }
  .heat i.l1 { background: rgba(10,132,255,.35); } .heat i.l2 { background: rgba(10,132,255,.6); } .heat i.l3 { background: #0a84ff; } .heat i.today { outline: 1px solid rgba(255,255,255,.5); outline-offset: 1px; }
  .streak .ft { display: flex; gap: 10px; margin-top: 10px; font-size: 10.5px; color: var(--muted); }
  .tk-actions .fxb { background: var(--blue); color: #fff; } .tk-actions .fxb.on { background: #ff453a; }

  /* estado fechado */
  #mini { position: absolute; inset: 0; height: 30px; display: flex; align-items: center; justify-content: center; gap: 14px; padding: 0 14px; font-size: 11.5px; white-space: nowrap; transition: opacity .15s; }
  body.open #mini { opacity: 0; pointer-events: none; }
  #mini .seg { display: flex; align-items: center; gap: 6px; color: #d8d8dd; }
  #mini .seg svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2; }
  #mini .track { max-width: 130px; overflow: hidden; }
  #mini .track span { display: inline-block; padding-left: 0; }
  #mini .track.scroll span { animation: marquee 9s linear infinite; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(calc(-100% + 130px)); } }
  #mini .bar { width: 26px; height: 4px; border-radius: 2px; background: var(--bg3); overflow: hidden; } #mini .bar i { display: block; height: 100%; }
  #mini .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
  #mini .clock b { font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .3px; } #mini .wi { font-size: 13px; }
  #mini .dot.playing { animation: pulse 1.2s ease-in-out infinite; } @keyframes pulse { 50% { opacity: .35; } }

  /* estado aberto */
  #panel { position: absolute; left: 0; top: 0; width: 100%; display: flex; flex-direction: column; opacity: 0; transition: opacity .2s .05s; }
  body.open #panel { opacity: 1; }
  #tabs { display: flex; align-items: center; justify-content: center; gap: 4px; padding: 10px 12px 6px; }
  .tab { width: 38px; height: 32px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--muted); position: relative; }
  .tab svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .tab:hover { background: var(--bg2); color: var(--fg); } .tab.on { background: var(--bg3); color: var(--fg); }
  .tab .cnt { position: absolute; top: 2px; right: 3px; min-width: 14px; height: 14px; border-radius: 7px; background: var(--warn); color: #1a1200; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
  #tabs .sp { flex: 1; } #tabs .clock { font-size: 12px; color: var(--muted); padding: 0 8px; font-variant-numeric: tabular-nums; }
  #view { flex: 1; overflow: auto; padding: 6px 18px 16px; scrollbar-width: none; max-height: 500px; } #view::-webkit-scrollbar { display: none; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 8px 0 8px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .grow { flex: 1; min-width: 0; }
  .muted { color: var(--muted); font-size: 11.5px; }
  button { border: 0; border-radius: 9px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--bg3); color: var(--fg); }
  button:hover { background: rgba(255,255,255,.16); } button.pri { background: var(--acc); color: #120a2a; } button.icon { width: 34px; height: 34px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
  button.icon svg { width: 16px; height: 16px; fill: currentColor; }
  input, textarea { background: rgba(0,0,0,.35); color: var(--fg); border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; font: inherit; font-size: 12.5px; user-select: text; }
  input:focus, textarea:focus { outline: 1px solid var(--acc); }
  .bar { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--info); border-radius: 3px; transition: width .4s; }
  .spark { width: 100%; height: 34px; display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
  #instGrid { max-height: 232px; overflow: auto; scrollbar-width: none; padding-bottom: 2px; } #instGrid::-webkit-scrollbar { display: none; }
  .app { background: var(--bg2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; position: relative; text-align: center; }
  .app:hover { background: var(--bg3); } .app img { width: 34px; height: 34px; border-radius: 9px; object-fit: contain; } .app .nm { font-size: 11px; line-height: 1.2; max-height: 27px; overflow: hidden; }
  .app .x { position: absolute; top: 4px; right: 7px; color: var(--muted); font-size: 13px; display: none; } .app:hover .x { display: block; } .app .x:hover { color: var(--bad); }
  .app .pin { position: absolute; top: 3px; left: 7px; color: var(--muted); font-size: 12px; display: none; } .app:hover .pin { display: block; } .app.pinned .pin { display: block; color: var(--warn); }
  .app.add { border-style: dashed; color: var(--muted); justify-content: center; }
  /* música */
  .music { display: grid; grid-template-columns: 104px 1fr; gap: 16px; align-items: center; }
  .art { width: 104px; height: 104px; border-radius: 20px; background: linear-gradient(135deg, #2a1e4d, #0f2a3d); display: grid; place-items: center; color: var(--acc); overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .art img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #mini .cover { width: 18px; height: 18px; border-radius: 5px; object-fit: cover; }
  .art svg { width: 40px; height: 40px; fill: currentColor; }
  .art.playing { animation: glow 3s ease-in-out infinite; } @keyframes glow { 50% { box-shadow: 0 0 28px rgba(167,139,250,.35); } }
  .title { font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .artist { color: #c9c9cf; font-size: 13px; margin-top: 2px; }

// a linha azul acompanha a base da pastilha (a largura da pastilha muda, então recalcula sempre)
function paintFocus() {
  const on = fx.active && (settings.focus || {}).pill !== false;
  document.body.classList.toggle('focusing', on);
  document.body.classList.toggle('paused', on && !fx.running);
  const svg = $('#fxsvg'); if (!svg || !on) return;
  const pill = $('#pill'); const open = document.body.classList.contains('open');
  const W = pill.offsetWidth || 240, H = pill.offsetHeight || 30;
  const B = open ? 26 : 18;                 // raio da mordida (igual ao CSS de #pill::before/::after)
  const inset = 1.25;                        // metade do traço, para a linha ficar por dentro da borda
  // raio dos cantos de baixo: na pastilha fechada (30 px) a mordida e o canto se sobrepõem, então o canto encolhe
  const R = Math.max(4, Math.min(open ? 28 : 18, H / 2, H - inset - B));
  // origem do SVG = canto superior esquerdo da mordida esquerda (x = -B em relação à pastilha)
  const x0 = B, x1 = B + W, y0 = inset, yb = H - inset;
  const d = [
    `M 0 0`,
    `A ${B} ${B} 0 0 1 ${x0 + inset} ${B}`,                 // mordida esquerda: côncava, desce até a lateral
    `L ${x0 + inset} ${yb - R}`,
    `A ${R - inset} ${R - inset} 0 0 0 ${x0 + R} ${yb}`,   // canto inferior esquerdo
    `L ${x1 - R} ${yb}`,
    `A ${R - inset} ${R - inset} 0 0 0 ${x1 - inset} ${yb - R}`,   // canto inferior direito
    `L ${x1 - inset} ${B}`,
    `A ${B} ${B} 0 0 1 ${x1 + B} 0`                           // mordida direita: sobe até a borda da tela
  ].join(' ');
  svg.setAttribute('width', W + 2 * B); svg.setAttribute('height', H + 4);
  svg.style.left = (-B) + 'px';
  svg.querySelector('.trk').setAttribute('d', d);
  const run = svg.querySelector('.run'); run.setAttribute('d', d);
  run.style.strokeDasharray = '1000'; run.style.strokeDashoffset = String(Math.round(1000 * (1 - Math.max(0, Math.min(1, fx.progress)))));
}

function spark(arr, max, color) {
  if (!arr || arr.length < 2) return '';
  const mx = max || Math.max(...arr, 1);
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * 100).toFixed(1)},${(34 - v / mx * 30).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 100 34" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>`;
}

// calendário
let calSel = null, calWeek = 0, calShowAll = false;   // dia selecionado (ms à meia-noite), deslocamento de semanas
const DAYMS = 86400000;
const day0 = (t) => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
function viewCal() {
  if (!cal) return '<div class="empty">Carregando…</div>';
  const today = day0(Date.now());
  if (calSel == null) calSel = today;
  const events = cal.events || [];
  const onDay = (t) => events.filter((e) => e.start < t + DAYMS && e.end > t);
  // faixa: 8 dias começando 3 dias antes de hoje, deslocada por semanas
  const base = today - 3 * DAYMS + calWeek * 7 * DAYMS;
  const days = Array.from({ length: 8 }, (_, i) => base + i * DAYMS);
  const mon = new Date(calSel).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
  const WD = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
  const src = (settings.calendar && settings.calendar.sources || []).length;
  let h = `<div class="row" style="justify-content:space-between;margin-bottom:-4px"><button id="cwPrev" class="icon" style="width:28px;height:28px">${I.left}</button><span class="muted">${calWeek === 0 ? 'esta semana' : (calWeek > 0 ? '+' : '') + calWeek + ' semana(s)'} · <a id="cwToday" style="cursor:pointer;color:var(--info)">hoje</a></span><button id="cwNext" class="icon" style="width:28px;height:28px">${I.right}</button></div>`;

  if (!src && !hubCal && !(cal.hubCount)) return h + `<div class="empty">${I.calEmpty}Nenhum calendário configurado.<div class="muted" style="margin-top:4px">Vincule o Medsystem Hub (a agenda do Hub entra aqui) ou Configurações → Calendário → link .ics.</div></div>`;
  const errs = Object.entries(cal.errors || {}); if (errs.length) h += `<div class="muted" style="color:var(--bad);margin-bottom:6px">${errs.map(([n, e]) => esc(n) + ': ' + esc(e)).join(' · ')}</div>`;
  const ev = (e) => `<div class="ev" ${e.link ? `data-evl="${esc(e.link)}" style="cursor:pointer"` : ''}><div class="c" style="background:${e.color}"></div><div class="t">${e.allDay ? 'dia todo' : hhmm(e.start) + '–' + hhmm(e.end)}</div><div class="grow"><div class="s">${esc(e.title)}</div>${e.location || e.hub ? `<div class="muted">${esc([e.location, e.hub ? e.source : ''].filter(Boolean).join(' · '))}</div>` : ''}</div></div>`;

  const label = calSel === today ? 'Hoje' : calSel === today + DAYMS ? 'Amanhã' : calSel === today - DAYMS ? 'Ontem' : new Date(calSel).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' }).replace('.', '');
  h += `<h3>${label}${list.length ? ` <span class="muted" style="text-transform:none;letter-spacing:0">· ${list.length}</span>` : ''}</h3><div class="card">${shown.length ? shown.map(ev).join('') + (more > 0 ? `<div class="muted" id="calMore" style="padding-top:8px;cursor:pointer">+ ${more} mais</div>` : '') : `<div class="empty">${I.calEmpty}Nada neste dia</div>`}</div>`;
  const later = events.filter((e) => e.start >= calSel + DAYMS).slice(0, 4);
  if (later.length) h += `<h3>Próximos</h3><div class="card">${later.map((e) => `<div class="ev"><div class="c" style="background:${e.color}"></div><div class="t">${new Date(e.start).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit' }).replace('.', '')}${e.allDay ? '' : ' ' + hhmm(e.start)}</div><div class="grow"><div class="s">${esc(e.title)}</div></div></div>`).join('')}</div>`;
  return h;
}

function fxRing(p, color = '#0a84ff') {

}
function viewFocusNow() {

function viewStreak() {

  const cells = []; const today = new Date(); today.setHours(12, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 69);
  start.setDate(start.getDate() - ((start.getDay() + 6) % 7));   // começa numa segunda
  for (let i = 0; i < 77; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    const key = d.toISOString().slice(0, 10); const secs = byDay[key] || 0;

}

  const list = caps.filter((c) => !q || (c.text || '').toLowerCase().includes(q));
  return `<div class="row" style="margin-bottom:10px;gap:8px"><div class="search grow" style="margin:0">${I.search}<input id="capsQ" placeholder="Buscar pelo texto da captura (OCR)…" value="${esc(capsQ)}"></div><button class="pillbtn blue" id="capNew">${I.add} Capturar área</button></div>
    <div class="lst" style="max-height:430px">${list.length ? `<div class="caps">${list.slice(0, 60).map((c) => `<div class="cap ${c.pinned ? 'pinned' : ''}" data-cap="${c.id}" title="${esc((c.text || '').slice(0, 200) || 'Clique para trazer de volta · duplo clique edita')}"><img src="${c.thumb}">${c.annotated ? '<span class="badge">editada</span>' : ''}${c.pinned ? '<span class="badge pin">fixada</span>' : ''}<span class="x" data-capdel="${c.id}" title="Apagar">×</span><div class="ft"><span>${c.w}×${c.h}</span><span>${ago(c.at)}</span></div></div>`).join('')}</div>` : `<div class="empty">${I.caps}Nenhuma captura ainda.<div class="muted" style="margin-top:4px">Atalho ${esc((settings.shortcuts && settings.shortcuts.capture) || 'Ctrl+Shift+X')}: arraste na tela e a captura entra na pilha do canto — copiar, salvar, editar, enviar link ou ler o texto.</div></div>`}</div>`;
}
function bindCaps() {
  const refresh = () => { const v = $('#view'); const q = $('#capsQ'); const keep = q && document.activeElement === q; const pos = keep ? q.selectionStart : 0; v.innerHTML = viewCaps(); bindCaps(); if (keep) { const nq = $('#capsQ'); api.setFocusable(true); nq.focus(); nq.setSelectionRange(pos, pos); } fitPill(); };
  $('#capsQ').oninput = () => { capsQ = $('#capsQ').value; refresh(); };
  $('#capNew').onclick = () => { setOpen(false); setTimeout(() => api.qaCapture(), 150); };
  document.querySelectorAll('[data-cap]').forEach((el) => { el.onclick = (e) => { if (e.target.dataset.capdel) return; api.qaRestore(el.dataset.cap); }; el.ondblclick = () => api.qaEdit(el.dataset.cap); });
  document.querySelectorAll('[data-capdel]').forEach((b) => b.onclick = async (e) => { e.stopPropagation(); caps = await api.qaRemove(b.dataset.capdel); refresh(); });
}

// banner estilo Dynamic Island na pastilha fechada
let bannerTimer = null;
function showBanner(n) {
  if (document.body.classList.contains('open')) return;
  clearTimeout(bannerTimer);
  const box = $('#mini');
  const wa = n.type === 'chat';
  box.innerHTML = `<div class="bn-ic ${wa ? 'wa' : ''}">${wa ? (n.kind === 'transfer' ? I.transfer : n.kind === 'assign' ? I.user : I.wa) : I.bell}</div><div class="bn"><div class="t">${esc(n.title)}</div><div class="m">${esc(n.text || '')}</div></div><span class="bn-x" id="bnX">×</span>`;
  document.body.classList.add('banner');
  $('#pill').style.width = '460px'; $('#pill').style.height = '62px';
  box.onclick = (e) => { if (e.target.id === 'bnX') { hideBanner(); return; } api.hubOpen(n.link, n.hubNotifId); hideBanner(); };
  bannerTimer = setTimeout(hideBanner, 9000);
}
function hideBanner() { clearTimeout(bannerTimer); if (!document.body.classList.contains('banner')) return; document.body.classList.remove('banner'); $('#mini').onclick = null; $('#pill').style.height = ''; renderMini(); }

// ---------- sons (Web Audio; sem arquivos) ----------
let actx = null;
function tone(ctx, t0, freq, dur, vol, type = 'sine', slide = 0) {
  const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, t0); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + dur + 0.05);
}
function playPreset(preset, vol) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime + 0.02, v = Math.max(0.02, vol);
    if (preset === 'pop') { tone(actx, t, 880, 0.12, v, 'sine'); tone(actx, t + 0.11, 1320, 0.16, v * 0.8, 'sine'); }
    else if (preset === 'message') { tone(actx, t, 1567, 0.09, v * 0.9, 'triangle'); tone(actx, t + 0.09, 2093, 0.14, v * 0.7, 'triangle'); }   // dois toques agudos, tipo app de mensagens
    else if (preset === 'bell') { tone(actx, t, 1760, 0.6, v, 'sine'); tone(actx, t, 3520, 0.35, v * 0.25, 'sine'); tone(actx, t + 0.004, 2637, 0.4, v * 0.15, 'sine'); }
    else if (preset === 'soft') { tone(actx, t, 523, 0.35, v * 0.7, 'sine', 120); }
    else if (preset === 'chime') { [523, 659, 784].forEach((f, i) => tone(actx, t + i * 0.12, f, 0.35, v * 0.8, 'sine')); }
    else tone(actx, t, 880, 0.15, v, 'sine');
  } catch { /* sem áudio */ }
}
function playSound(d) {
  if (!d) return;
  if (d.preset === 'file' && d.file) { try { const a = new Audio(d.file.startsWith('file:') ? d.file : 'file:///' + d.file.replace(/\\/g, '/')); a.volume = d.volume ?? 0.6; a.play().catch(() => playPreset('pop', d.volume ?? 0.6)); } catch { playPreset('pop', d.volume ?? 0.6); } return; }
  playPreset(d.preset, d.volume ?? 0.6);
}

// ---------- abrir/fechar + click-through ----------
function typing() { const a = document.activeElement; return a && (/(INPUT|TEXTAREA)/.test(a.tagName) || a.isContentEditable); }
const SIZES = { hub: [760, 0], board: [700, 0], coffee: [660, 0], ideia: [720, 0], files: [700, 0], cmds: [720, 0], chat: [640, 0], clip: [640, 0], caps: [700, 0], music: [520, 0], sys: [640, 0], apps: [720, 0], notes: [700, 0], canvas: [760, 0], cal: [620, 0] };
function fitPill() {
  if (!document.body.classList.contains('open')) return;
  const w = (SIZES[tab] || [640])[0];
  const h = Math.min(548, $('#tabs').offsetHeight + $('#view').scrollHeight + 6);
  const pill = $('#pill'); pill.style.width = w + 'px'; pill.style.height = h + 'px';
  sendHot(); setTimeout(sendHot, 300);
  // o traçado do foco acompanha a nova largura/altura (a transição de tamanho leva 250 ms)
  clearTimeout(fitPill._fx); fitPill._fx = setTimeout(paintFocus, 280); paintFocus();
}
// a janela do notch tem 960×560, mas só a pastilha é clicável: manda o retângulo real ao main,
// que devolve o click-through assim que o cursor sai dele (evita o mouse preso na área transparente)
let hotLast = '';
function sendHot() {
  const p = $('#pill').getBoundingClientRect(), t = $('#hit').getBoundingClientRect();
  const x = Math.floor(Math.min(p.left, t.left)) - 26;             // as mordidas laterais fazem parte da pastilha
  const r = { x, y: 0, w: Math.ceil(Math.max(p.right, t.right)) + 26 - x, h: Math.ceil(Math.max(p.bottom, t.bottom)) };
  const k = `${r.x}|${r.w}|${r.h}`; if (k === hotLast) return;
  hotLast = k; api.notchHot(r);
}
function setOpen(v) {
  if (!v && (pinned || typing() || drag)) return;
  if (v && document.body.classList.contains('banner')) hideBanner();
  if (v && !document.body.classList.contains('open')) { renderTabs(); renderView(); }
  document.body.classList.toggle('open', v);
  if (v) fitPill(); else { $('#pill').style.height = ''; api.setFocusable(false); renderMini(); clearTimeout(fitPill._fx); fitPill._fx = setTimeout(paintFocus, 280); }
  sendHot(); setTimeout(sendHot, 300);
}
const root = $('#root');
// o main reinstala um hook global de mouse a cada setIgnoreMouse: só avisa quando o estado muda
let ignoreState = null;
const setIgnore = (v) => { if (ignoreState !== v) { ignoreState = v; api.setIgnoreMouse(v); } };
setInterval(sendHot, 2000);   // largura muda com o conteúdo da pastilha fechada
root.addEventListener('mousemove', (e) => { const ui = e.target.closest('#pill, #hit'); setIgnore(!ui); if (ui) { clearTimeout(openTimer); setOpen(true); } });
document.addEventListener('mouseleave', () => { setIgnore(true); openTimer = setTimeout(() => setOpen(false), 350); });
root.addEventListener('mouseover', (e) => { if (!e.target.closest('#pill, #hit')) openTimer = setTimeout(() => setOpen(false), 350); });
document.addEventListener('focusout', () => setTimeout(() => { if (!typing()) api.setFocusable(false); }, 50));
// janela é não-focável por padrão (não rouba foco); ao clicar num campo, torna focável antes de o foco acontecer
document.addEventListener('mousedown', (e) => { const t = e.target; if (t && (/(INPUT|TEXTAREA)/.test(t.tagName) || t.isContentEditable)) { api.setFocusable(true); setTimeout(() => t.focus(), 30); } }, true);

(async () => {
  settings = await api.getSettings(); tab = (settings.notch && settings.notch.tab) || 'music'; if (!TABS.some((t) => t[0] === tab)) tab = 'music';
  hub = await api.hubGet(); clips = (await api.clipList()) || []; caps = (await api.qaList()) || []; sys = await api.getSystem(); cal = await api.getCalendar(); docs = await api.getDocs(); approvals = await api.getApprovals(); webapps = await api.listWebApps();
  renderMini();
  let musicKey = '';
  api.onSystem((s) => { sys = s; renderMini(); if (!document.body.classList.contains('open')) return; if (tab === 'sys') renderView(); if (tab === 'music') { const m = s.media; const k = m ? `${m.title}|${m.artist}|${m.playing}|${!!m.art}` : ''; if (k !== musicKey) { musicKey = k; renderView(); } } });
  api.onCalendar((c) => { cal = c; renderMini(); if (tab === 'cal' && document.body.classList.contains('open')) renderView(); });
  wx = await api.getWeather(); api.onWeather((w) => { wx = w; renderMini(); if (tab === 'sys' && document.body.classList.contains('open')) renderView(); });
  api.onSettings((s) => { settings = s; renderMini(); });
  api.onIdeia((st) => { if (!st) return; ic = st; renderMini(); if (tab === 'ideia' && document.body.classList.contains('open') && !typing()) renderView(); });
  api.ideiaGet().then((st) => { if (st) { ic = st; renderMini(); } });
  api.onCoffee((st) => { if (!st) return; cof = st; renderMini(); if (tab === 'coffee' && document.body.classList.contains('open') && !typing()) renderView(); });
  api.coffeeGet().then((st) => { if (st) { cof = st; renderMini(); } });
  api.coffeeRefresh().catch(() => {});
  api.onFiles((l) => { files = l || []; if (tab === 'files' && document.body.classList.contains('open')) renderView(); });
  api.filesList().then((l) => { files = l || []; });
  api.cmdList().then((l) => { cmds = l || []; });
  // arrastar arquivo de fora para dentro da notch (só funciona com o modo bandeja armado — veja dropMode)
  document.addEventListener('dragenter', (e) => { e.preventDefault(); document.body.classList.add('dragging'); });
  document.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('dragging'); });
  document.addEventListener('drop', async (e) => {
    e.preventDefault(); document.body.classList.remove('dragging');
    const paths = [...(e.dataTransfer.files || [])].map((f) => api.pathForFile(f)).filter(Boolean);
    if (!paths.length) { msgFiles = 'Não consegui ler o arquivo arrastado.'; renderView(); return; }
    const antes = files.length; files = await api.filesAdd(paths);
    const n = Math.max(0, files.length - antes);
    msgFiles = n ? `✓ ${n} arquivo(s) na bandeja` : 'Esse item não é um arquivo do disco (pasta, atalho ou item virtual) — use Adicionar.';
    tab = 'files'; renderTabs(); setOpen(true); renderView();

  });
  // Esc sai do modo bandeja (e a notch volta a ser atravessável na hora)

  api.onDropMode((on) => { dropMode = !!on; document.body.classList.toggle('dropmode', dropMode); if (tab === 'files' && document.body.classList.contains('open')) renderView(); });
  api.onFocus((st) => { if (!st) return; fx = st; renderMini(); if (document.body.classList.contains('open') && tab === 'notes' && notesMode === 'tasks' && !typing()) renderView(); });
  api.focusGet().then((st) => { if (st) { fx = st; renderMini(); } });
  api.onHub((h) => { const wasUnread = hub && hub.unread; hub = h; renderMini(); if (document.body.classList.contains('open')) { renderTabs(); if ((tab === 'hub' || tab === 'notes' || tab === 'chat') && !typing()) renderView(); }  });
  api.onSound(playSound);
  api.onCaptures((l) => { caps = l || []; if (tab === 'caps' && document.body.classList.contains('open') && !typing()) renderView(); });
  api.onClipboard((l) => { clips = l || []; if (tab === 'clip' && document.body.classList.contains('open') && !typing()) renderView(); });
  api.onNotify((n) => { if ((n.type === 'hub' || n.type === 'chat') && !(settings.dnd)) showBanner(n); });
  api.onNotchOpen((t) => { tab = t || 'hub'; renderTabs(); setOpen(true); renderView(); setTimeout(() => { const q = $('#hbQ'); if (q) { api.setFocusable(true); q.focus(); q.select(); } }, 60); });
  api.onApprovals((a) => { approvals = a; renderMini(); });
  api.onBar((w) => { if (w === 'blur') { const a = document.activeElement; if (a && a.blur) a.blur(); } });
  setInterval(() => { if (!document.body.classList.contains('open')) renderMini(); }, 20000);
  setInterval(() => { if (document.body.classList.contains('open')) { const c = document.querySelector('#tabs .clock'); if (c) c.textContent = `${new Date().toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })} · ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`; } }, 15000);
})();
</script>
