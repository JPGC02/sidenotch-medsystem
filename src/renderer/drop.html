<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Soltar na bandeja</title>
<style>
  /* Alvo de soltura: janela pequena que só existe enquanto espera o arquivo.
     A notch nunca deixa de ser atravessável — por isso o mouse não trava mais. */
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; color: #f4f4f6; }
  #box { position: absolute; inset: 8px; border-radius: 22px; background: linear-gradient(180deg, rgba(22,22,28,.92), rgba(14,14,19,.92));
    border: 2px dashed rgba(10,132,255,.65); backdrop-filter: blur(24px) saturate(1.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.14); transition: transform .18s, border-color .18s, background .18s; }
  body.over #box { transform: scale(1.03); border-color: #0a84ff; background: linear-gradient(180deg, rgba(10,132,255,.22), rgba(14,14,19,.95)); }
  body.done #box { border-style: solid; border-color: #30d158; }
  .ic { width: 46px; height: 46px; border-radius: 14px; background: rgba(10,132,255,.18); display: grid; place-items: center; color: #7fc0ff; }
  .ic svg { width: 24px; height: 24px; } body.done .ic { background: rgba(48,209,88,.18); color: #7ee89c; }
  h1 { font-size: 14px; font-weight: 700; letter-spacing: -.2px; }
  p { font-size: 11.5px; color: #9a9aa4; text-align: center; padding: 0 18px; line-height: 1.4; }
  kbd { background: rgba(255,255,255,.1); border-radius: 5px; padding: 1px 5px; font-size: 10.5px; }
  #bar { position: absolute; left: 22px; right: 22px; bottom: 16px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.12); overflow: hidden; }
  #bar i { display: block; height: 100%; background: #0a84ff; width: 100%; transform-origin: left; animation: run linear forwards; }
  @keyframes run { to { transform: scaleX(0); } }
</style>
</head>
<body>
<div id="box">
  <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></span>
  <h1 id="t">Solte o arquivo aqui</h1>
  <p id="s">Ele entra na bandeja e pode ser arrastado para qualquer app · <kbd>Esc</kbd> cancela</p>
</div>
<div id="bar"><i id="run"></i></div>
<script>
const api = window.sidenotch;
const SECS = Number(new URLSearchParams(location.search).get('secs') || 25);
document.getElementById('run').style.animationDuration = SECS + 's';
const on = (ev, fn) => document.addEventListener(ev, fn);
on('dragenter', (e) => { e.preventDefault(); document.body.classList.add('over'); });
on('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; document.body.classList.add('over'); });
on('dragleave', (e) => { if (e.relatedTarget === null) document.body.classList.remove('over'); });
on('drop', async (e) => {
  e.preventDefault(); document.body.classList.remove('over');
  const paths = [...(e.dataTransfer.files || [])].map((f) => api.pathForFile(f)).filter(Boolean);
  if (!paths.length) { document.getElementById('t').textContent = 'Não consegui ler esse item'; return; }
  const l = await api.filesAdd(paths);
  document.body.classList.add('done');
  document.getElementById('t').textContent = `${paths.length} arquivo(s) na bandeja`;
  document.getElementById('s').textContent = 'Abrindo a bandeja…';
  setTimeout(() => api.dropMode(false), 700);
});
on('keydown', (e) => { if (e.key === 'Escape') api.dropMode(false); });
window.addEventListener('blur', () => setTimeout(() => { if (!document.body.classList.contains('over')) api.dropMode(false); }, 15000));
</script>
</body>
</html>
