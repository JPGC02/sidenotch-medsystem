<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Editar captura</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root { --ink: #0B0C0E; --panel: #141619; --panel2: #1B1E22; --line: #262A2F; --fg: #ECEEF1; --mute: #878F99; --signal: #3ECF8E; --blue: #0A84FF; --red: #FF3B30; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--ink); color: var(--fg); font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased; user-select: none; }
  #app { display: grid; grid-template-columns: 64px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; }
  .tool { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; cursor: pointer; color: var(--mute); position: relative; }
  .tool svg { width: 20px; height: 20px; } .tool:hover { background: var(--panel2); color: var(--fg); } .tool.on { background: rgba(10,132,255,.18); color: #fff; box-shadow: inset 0 0 0 1px rgba(10,132,255,.5); }
  .tool .k { position: absolute; right: 5px; bottom: 3px; font-family: "JetBrains Mono", monospace; font-size: 9px; color: var(--mute); }
  aside .sp { flex: 1; } aside .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); cursor: pointer; } aside .sw.on { border-color: #fff; }
  main { display: flex; flex-direction: column; min-width: 0; }
  header { height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header b { font-weight: 600; } header .meta { color: var(--mute); font-family: "JetBrains Mono", monospace; font-size: 11px; } header .sp { flex: 1; }
  button { border: 0; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; background: var(--panel2); color: var(--fg); } button.pri { background: var(--blue); color: #fff; } button:hover { filter: brightness(1.12); }
  kbd { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--mute); margin-left: 6px; }
  #stage { flex: 1; display: grid; place-items: center; overflow: auto; padding: 24px; background: radial-gradient(rgba(255,255,255,.04) 1px, transparent 1px) 0 0 / 18px 18px; }
  canvas { box-shadow: 0 24px 60px rgba(0,0,0,.6); border-radius: 4px; cursor: crosshair; max-width: 100%; }
  canvas.sel { cursor: move; }
  #textbox { position: fixed; display: none; background: rgba(10,11,12,.9); color: var(--red); border: 1px solid var(--blue); border-radius: 8px; padding: 6px 8px; font: 600 14px "Instrument Sans", sans-serif; min-width: 120px; outline: 0; resize: none; }
  #hint { padding: 8px 16px; color: var(--mute); font-size: 11.5px; border-top: 1px solid var(--line); background: var(--panel); }
</style>
</head>
<body>
<div id="app">
  <aside>
    <div class="tool on" data-t="select" title="Selecionar / mover (V)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3l14 8-6 2-3 6z"/></svg><span class="k">V</span></div>
    <div class="tool" data-t="arrow" title="Seta (A)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 19L19 5M10 5h9v9"/></svg><span class="k">A</span></div>
    <div class="tool" data-t="rect" title="Retângulo (R)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="2"/></svg><span class="k">R</span></div>
    <div class="tool" data-t="blur" title="Borrar (B)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/><rect x="13" y="4" width="7" height="7" opacity=".4"/><rect x="4" y="13" width="7" height="7" opacity=".4"/></svg><span class="k">B</span></div>
    <div class="tool" data-t="text" title="Texto (T)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 6h14M12 6v13M9 19h6"/></svg><span class="k">T</span></div>
    <div class="tool" id="undo" title="Desfazer (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></div>
    <div class="tool" id="del" title="Apagar selecionado (Delete)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></div>
    <div class="sp"></div>
    <div class="sw on" data-c="#FF3B30" style="background:#FF3B30"></div><div class="sw" data-c="#0A84FF" style="background:#0A84FF"></div><div class="sw" data-c="#E0B44C" style="background:#E0B44C"></div><div class="sw" data-c="#FFFFFF" style="background:#fff"></div>
  </aside>
  <main>
    <header><b id="title">Captura</b><span class="meta" id="meta"></span><span class="sp"></span><button id="cancel">Cancelar<kbd>Esc</kbd></button><button class="pri" id="save">Salvar<kbd>Ctrl+S</kbd></button></header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div id="hint">Arraste para desenhar · V seleciona e move · duplo clique num texto edita · as formas ficam guardadas e podem ser reeditadas.</div>
  </main>
</div>
<textarea id="textbox" rows="1"></textarea>
<script src="annotations.js"></script>
<script>
const api = window.sidenotch; const A = window.Annotations;
const id = new URLSearchParams(location.search).get('id');
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), tb = document.getElementById('textbox');
let img = null, shapes = [], history = [], tool = 'select', color = A.RED, sel = -1, drag = null, scale = 1;
const $ = (s) => document.querySelector(s);

function fit() { const st = document.getElementById('stage'); const maxW = st.clientWidth - 48, maxH = st.clientHeight - 48; scale = Math.min(1, maxW / img.width, maxH / img.height); cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale); draw(); }
function draw() { ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height); A.render(ctx, shapes, cv.width, cv.height, img, sel); }
function snap() { history.push(JSON.stringify(shapes)); if (history.length > 100) history.shift(); }
function undo() { if (!history.length) return; shapes = JSON.parse(history.pop()); sel = -1; draw(); }
const norm = (e) => { const r = cv.getBoundingClientRect(); return { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) }; };

document.querySelectorAll('.tool[data-t]').forEach((t) => t.onclick = () => setTool(t.dataset.t));
function setTool(t) { tool = t; document.querySelectorAll('.tool[data-t]').forEach((x) => x.classList.toggle('on', x.dataset.t === t)); cv.classList.toggle('sel', t === 'select'); if (t !== 'select') { sel = -1; draw(); } }
document.querySelectorAll('.sw').forEach((s) => s.onclick = () => { color = s.dataset.c; document.querySelectorAll('.sw').forEach((x) => x.classList.toggle('on', x === s)); if (sel >= 0 && shapes[sel].type !== 'blur') { snap(); shapes[sel].color = color; draw(); } });
$('#undo').onclick = undo; $('#del').onclick = () => { if (sel >= 0) { snap(); shapes.splice(sel, 1); sel = -1; draw(); } };

cv.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return; const p = norm(e);
  if (tool === 'select') { sel = A.hit(shapes, p.x, p.y); draw(); if (sel >= 0) { snap(); drag = { move: true, px: p.x, py: p.y, s: { ...shapes[sel] } }; } return; }
  if (tool === 'text') { openText(p, null); return; }
  snap(); shapes.push({ type: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y, color: tool === 'blur' ? undefined : color }); drag = { idx: shapes.length - 1 };
});
cv.addEventListener('pointermove', (e) => {
  if (!drag) return; const p = norm(e);
  if (drag.move) { const s = shapes[sel], dx = p.x - drag.px, dy = p.y - drag.py; s.x1 = drag.s.x1 + dx; s.y1 = drag.s.y1 + dy; s.x2 = drag.s.x2 + dx; s.y2 = drag.s.y2 + dy; }
  else { const s = shapes[drag.idx]; s.x2 = p.x; s.y2 = p.y; }
  draw();
});
cv.addEventListener('pointerup', () => { if (drag && drag.idx != null) { const s = shapes[drag.idx]; if (Math.abs(s.x2 - s.x1) < 0.004 && Math.abs(s.y2 - s.y1) < 0.004) { shapes.splice(drag.idx, 1); history.pop(); } } drag = null; draw(); });
cv.addEventListener('dblclick', (e) => { const p = norm(e); const i = A.hit(shapes, p.x, p.y); if (i >= 0 && shapes[i].type === 'text') openText({ x: shapes[i].x1, y: shapes[i].y1 }, i); });

function openText(p, idx) {
  const r = cv.getBoundingClientRect(); tb.style.display = 'block'; tb.style.left = (r.left + p.x * r.width) + 'px'; tb.style.top = (r.top + p.y * r.height) + 'px'; tb.style.color = idx >= 0 ? (shapes[idx].color || color) : color;
  tb.value = idx >= 0 ? shapes[idx].text : ''; tb.dataset.idx = idx == null ? -1 : idx; tb.dataset.x = p.x; tb.dataset.y = p.y; tb.focus();
}
function commitText() {
  if (tb.style.display === 'none') return; const v = tb.value.trim(); const idx = Number(tb.dataset.idx); tb.style.display = 'none';
  if (!v) { if (idx >= 0) { snap(); shapes.splice(idx, 1); } draw(); return; }
  snap();
  if (idx >= 0) shapes[idx].text = v; else { const x = Number(tb.dataset.x), y = Number(tb.dataset.y); shapes.push({ type: 'text', x1: x, y1: y, x2: Math.min(1, x + 0.25), y2: Math.min(1, y + 0.08), text: v, color, size: 1 }); }
  draw();
}
tb.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); commitText(); } if (e.key === 'Escape') { tb.style.display = 'none'; } e.stopPropagation(); });
tb.addEventListener('blur', commitText);

async function save() { const png = A.rasterize(img, shapes); await api.qaEditorSave(id, shapes, shapes.length ? png : null); window.close(); }
$('#save').onclick = save; $('#cancel').onclick = () => window.close();
document.addEventListener('keydown', (e) => {
  if (e.target === tb) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
  else if (e.key === 'Escape') window.close();
  else if (e.key === 'Delete' || e.key === 'Backspace') $('#del').click();
  else if (!e.ctrlKey && !e.metaKey) { const m = { v: 'select', a: 'arrow', r: 'rect', b: 'blur', t: 'text' }[e.key.toLowerCase()]; if (m) setTool(m); }
});
window.addEventListener('resize', () => img && fit());

(async () => {
  const d = await api.qaEditorLoad(id); if (!d) { window.close(); return; }
  shapes = d.shapes || []; $('#title').textContent = `Captura ${new Date(d.item.at).toLocaleString('pt-BR')}`; $('#meta').textContent = `${d.item.w} × ${d.item.h}`;
  img = new Image(); img.onload = fit; img.src = d.image;
})();
</script>
</body>
</html>
