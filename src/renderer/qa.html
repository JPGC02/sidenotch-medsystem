<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quick Access</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Quick Access — valores calibrados: card 200 px, raio 14, moldura 4 px, sombra 0 12px 32px .38, gap 12, anel azul #0A84FF / fixado #E0B44C */
  :root { --card-w: 200px; --gap: 12px; --blue: #0A84FF; --pin: #E0B44C; --fg: #ECEEF1; --mute: #878F99;
    --ease-move: linear(0, 0.0287, 0.0949, 0.1779, 0.2658, 0.3518, 0.4322, 0.5054, 0.5709, 0.6288, 0.6796, 0.7238, 0.7622, 0.7955, 0.8241, 0.8489, 0.8702, 0.8885, 0.9042, 0.9178, 0.9294, 0.9394, 0.948, 0.9553, 0.9617, 0.9671, 0.9718, 0.9758, 0.9792, 0.9821, 0.9847, 0.9868, 0.9887, 0.9903, 0.9917, 0.9929, 0.9939, 0.9947, 0.9955, 0.9961, 0.9967, 0.9971, 0.9975, 0.9979, 0.9982, 0.9985, 0.9987, 0.9989, 0.999);
    --ease-fade: cubic-bezier(.32,.72,0,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Instrument Sans", "Segoe UI", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  #zone { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px 20px; display: flex; flex-direction: column-reverse; gap: var(--gap); align-items: flex-start; }
  body.right #zone { align-items: flex-end; }
  .card { position: relative; width: var(--card-w); border-radius: 14px; background: #fff; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.38); cursor: grab; will-change: transform; }
  .card.newest { box-shadow: 0 0 0 2px var(--blue), 0 12px 32px rgba(0,0,0,.38); } .card.pinned { box-shadow: 0 0 0 2px var(--pin), 0 12px 32px rgba(0,0,0,.38); }
  .card.dragging { cursor: grabbing; opacity: .7; }
  .card img { display: block; width: 100%; min-height: 110px; max-height: 260px; border-radius: 10px; object-fit: contain; background: #16181b; pointer-events: none; }
  .card .corner { position: absolute; width: 28px; height: 28px; border-radius: 9px; background: rgba(10,11,12,.86); color: #fff; display: grid; place-items: center; cursor: pointer; opacity: 0; transition: opacity .18s var(--ease-fade), transform .18s var(--ease-fade); transform: scale(.85); }
  .card .corner svg { width: 15px; height: 15px; } .card .corner:hover { background: #0A0B0C; transform: scale(1); }
  .card .c-x { top: 8px; left: 8px; } .card .c-pin { top: 8px; right: 8px; } .card .c-edit { bottom: 8px; left: 8px; } .card .c-up { bottom: 8px; right: 8px; }
  .card.pinned .c-pin { color: var(--pin); }
  /* nível 1: só os cantos inferiores. nível 2 (350 ms): scrim + tudo */
  .card.h1 .c-edit, .card.h1 .c-up, .card.h2 .corner { opacity: 1; transform: scale(1); }
  .card .scrim { position: absolute; inset: 4px; border-radius: 10px; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); opacity: 0; transition: opacity .2s var(--ease-fade); pointer-events: none; display: grid; place-items: center; }
  .card.h2 .scrim { opacity: 1; pointer-events: auto; }
  .pills { display: flex; gap: 6px; }
  .pill { background: rgba(255,255,255,.14); color: #fff; border: 0; border-radius: 999px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; }
  .pill:hover { background: rgba(255,255,255,.26); }
  .status { position: absolute; left: 4px; right: 4px; bottom: 4px; background: #0A0B0C; color: #fff; font-size: 11.5px; padding: 8px 10px 10px; border-radius: 0 0 10px 10px; display: none; }
  .status.on { display: block; } .status .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--blue); width: 0; transition: width .4s; }
  .status.ok { color: #3ECF8E; } .status.err { color: #FF6961; }
  .ttl { position: absolute; left: 4px; right: 4px; bottom: 4px; height: 3px; border-radius: 0 0 10px 10px; overflow: hidden; background: rgba(0,0,0,.08); }
  .ttl i { display: block; height: 100%; background: var(--blue); width: 100%; transform-origin: left; }
  .card.h1 .ttl, .card.h2 .ttl { display: none; }
  .empty { display: none; }
</style>
</head>
<body>
<div id="zone"></div>
<script src="iconsax.js"></script>
<script>
const api = window.sidenotch; const IX = window.IX || {};
const SPRING = getComputedStyle(document.documentElement).getPropertyValue('--ease-move').trim();
const FADE = 'cubic-bezier(.32,.72,0,1)';
let cfg = { ttl: 0, side: 'left' }, cards = new Map(), hoverT = null, hoverOut = null;
const zone = document.getElementById('zone');
const anim = (el, kf, o) => { try { return el.animate(kf, o); } catch { return null; } };
const LOG = (m) => { try { api.qaLog(m); } catch { /* ignore */ } };

function card(it) {
  const el = document.createElement('div'); el.className = 'card newest' + (it.pinned ? ' pinned' : ''); el.dataset.id = it.id;
  el.innerHTML = `<img src="${it.thumb}" draggable="false"><div class="scrim"><div class="pills"><button class="pill" data-a="copy">Copy</button><button class="pill" data-a="save">Save</button><button class="pill" data-a="ocr">Texto</button></div></div>
    <div class="corner c-x" data-a="close" title="Fechar (Alt: fecha todos)">${IX.CloseCircle}</div><div class="corner c-pin" data-a="pin" title="Fixar">${IX.Star1}</div>
    <div class="corner c-edit" data-a="edit" title="Editar">${IX.Brush2}</div><div class="corner c-up" data-a="upload" title="Enviar e copiar link (7 dias)">${IX.ExportSquare}</div>
    <div class="status"><span class="txt"></span><span class="bar"></span></div>${cfg.ttl ? '<div class="ttl"><i></i></div>' : ''}`;
  bind(el, it); return el;
}
function bind(el, it) {
  const id = it.id;
  // hover em dois níveis: parcial imediato, completo após 350 ms; sair some em < 200 ms
  el.addEventListener('pointerenter', () => { el.classList.add('h1'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.add('h2'), 350); pauseTtl(el, true); });
  el.addEventListener('pointerleave', () => { clearTimeout(el._t); el.classList.remove('h1', 'h2'); const st = el.querySelector('.status'); if (st.classList.contains('done')) { clearTimeout(st._t); st._t = setTimeout(() => st.classList.remove('on', 'done', 'ok', 'err'), 2500); } pauseTtl(el, false); });
  // drag nativo: threshold 6 px → o SO recebe um PNG real
  let down = null;
  el.addEventListener('pointerdown', (e) => { LOG('pointerdown ' + e.target.className + ' btn=' + e.button); if (e.button !== 0 || e.target.closest('[data-a]')) return; down = { x: e.clientX, y: e.clientY }; });
  el.addEventListener('pointermove', (e) => { if (!down) return; if (Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) { down = null; el.classList.add('dragging'); api.qaDrag(id); setTimeout(() => el.classList.remove('dragging'), 800); } });
  el.addEventListener('pointerup', () => { down = null; });
  el.addEventListener('dblclick', () => api.qaEdit(id));
  el.querySelectorAll('[data-a]').forEach((b) => b.addEventListener('click', async (e) => {
    e.stopPropagation(); const a = b.dataset.a; LOG('click ' + a + ' ' + id);
    if (a === 'close') { if (e.altKey) closeAll(); else remove(id); }
    else if (a === 'pin') { const p = await api.qaPin(id); el.classList.toggle('pinned', p); }
    else if (a === 'edit') api.qaEdit(id);
    else if (a === 'copy') { await api.qaCopy(id); status(el, 'Copiado ✓', 'ok'); }
    else if (a === 'save') { const f = await api.qaSave(id); if (f) status(el, 'Salvo ✓', 'ok'); }
    else if (a === 'upload') { status(el, 'Uploading…', '', true); const r = await api.qaUpload(id); if (r.ok) status(el, '✓ Link copied', 'ok'); else status(el, r.error, 'err'); }
    else if (a === 'ocr') { status(el, 'Lendo texto…', '', true); const r = await api.qaOcr(id); if (r.ok) status(el, r.text ? '✓ Texto copiado' : 'Nenhum texto encontrado', r.text ? 'ok' : 'err'); else status(el, r.error, 'err'); }
  }));
}
// status persiste até o mouse sair do card
function status(el, txt, cls, busy) { const st = el.querySelector('.status'); st.className = 'status on ' + (cls || ''); st.querySelector('.txt').textContent = txt; const bar = st.querySelector('.bar'); bar.style.width = busy ? '60%' : '0'; if (!busy) st.classList.add('done'); }

function push(it) {
  zone.querySelectorAll('.card.newest').forEach((c) => c.classList.remove('newest'));
  const old = cards.get(it.id); if (old) old.remove();
  const el = card(it); cards.set(it.id, el);
  zone.appendChild(el); fitSoon();   // column-reverse: o último filho fica no topo
  // entra pela borda com a mola glide (não voa da seleção)
  const dx = cfg.side === 'right' ? 240 : -240;
  anim(el, [{ transform: `translateX(${dx}px)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }], { duration: 733, easing: SPRING, fill: 'both' });
  startTtl(el);
}
function update(it) { const el = cards.get(it.id); if (el) { el.querySelector('img').src = it.thumb; el.classList.toggle('pinned', !!it.pinned); } }
function remove(id) {
  const el = cards.get(id); if (!el) return; LOG('remove ' + id + ' ' + new Error().stack.split('\n').slice(1, 4).join(' | '));
  const first = new Map([...zone.children].map((c) => [c, c.getBoundingClientRect().top]));
  const a = anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${cfg.side === 'right' ? 40 : -40}px)` }], { duration: 160, easing: FADE, fill: 'both' });
  const done = () => { el.remove(); cards.delete(id);
    // reflow FLIP dos que ficaram
    for (const [c, top] of first) { if (!c.isConnected) continue; const dy = top - c.getBoundingClientRect().top; if (dy) anim(c, [{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 733, easing: SPRING }); }
    fitSoon(); if (!cards.size) api.qaStackEmpty(); };
  if (a) a.finished.then(done).catch(done); else done();
}
function closeAll() { for (const [id, el] of [...cards]) if (!el.classList.contains('pinned')) remove(id); }
// auto-dismiss com barra que pausa no hover
function startTtl(el) { if (!cfg.ttl || el.classList.contains('pinned')) return; const bar = el.querySelector('.ttl i'); if (!bar) return; el._ttl = anim(bar, [{ transform: 'scaleX(1)' }, { transform: 'scaleX(0)' }], { duration: cfg.ttl * 1000, easing: 'linear', fill: 'forwards' }); if (el._ttl) el._ttl.finished.then(() => { if (!el.classList.contains('pinned')) remove(el.dataset.id); }).catch(() => {}); }
function pauseTtl(el, p) { if (!el._ttl) return; if (p) el._ttl.pause(); else if (!el.classList.contains('pinned')) el._ttl.play(); }

// a janela é redimensionada para caber exatamente a pilha: fora dela o mouse nunca é capturado
function fitWindow() { const h = zone.getBoundingClientRect().height; api.qaSize(Math.ceil(h) + 4); }
const fitSoon = () => { clearTimeout(fitSoon._t); fitSoon._t = setTimeout(fitWindow, 40); setTimeout(fitWindow, 820); };
new ResizeObserver(fitSoon).observe(zone);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
window.addEventListener('error', (e) => api.qaLog && api.qaLog('erro: ' + e.message + ' @' + e.lineno));
api.onQa((ev, data) => { LOG('event ' + ev + ' ' + (data && data.id || data)); if (ev === 'remove') { const el = cards.get(data); if (el) { el.remove(); cards.delete(data); fitSoon(); if (!cards.size) api.qaStackEmpty(); } } else if (ev === 'config') cfg = { ...cfg, ...data }, document.body.classList.toggle('right', cfg.side === 'right'); else if (ev === 'push') push(data); else if (ev === 'update') update(data); });
</script>
</body>
</html>
