<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Quadro · Sistemas</title>
<link rel="stylesheet" href="glass.css">
<style>
  :root { --fg: #f4f4f6; --muted: #9a9aa4; --blue: #0A84FF; --ok: #30d158; --bad: #ff453a; --warn: #ff9f0a; --purple: #bf5af2;
    --glass: rgba(255,255,255,.06); --glass2: rgba(255,255,255,.1); --line: rgba(255,255,255,.09); --ink: rgba(0,0,0,.28); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: transparent; color: var(--fg); font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; font-size: 13px; overflow: hidden; user-select: none; }
  body.solid { background: linear-gradient(160deg, #17171d, #0f0f13); }
  #drag { position: fixed; top: 0; left: 0; right: 140px; height: 36px; -webkit-app-region: drag; z-index: 5; }
  #app { display: flex; flex-direction: column; height: 100%; padding: 44px 20px 16px; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.3px; } header .sp { flex: 1; }
  .muted { color: var(--muted); } .grow { flex: 1; min-width: 0; }
  button { border: 0; border-radius: 10px; padding: 7px 12px; font: inherit; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--glass2); color: var(--fg); }
  button:hover { background: rgba(255,255,255,.16); } button.pri { background: var(--blue); color: #fff; } button:disabled { opacity: .5; cursor: default; }
  input, select { background: rgba(0,0,0,.32); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: inherit; font-size: 12.5px; user-select: text; }
  .seg { display: flex; background: rgba(0,0,0,.3); border: 1px solid var(--line); border-radius: 999px; padding: 2px; }
  .seg button { border-radius: 999px; padding: 5px 11px; font-size: 11.5px; background: transparent; } .seg button.on { background: var(--blue); color: #fff; }
  /* placar */
  #stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .kpi { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; min-width: 92px; }
  .kpi b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; line-height: 1.15; } .kpi span { font-size: 10.5px; color: var(--muted); }
  .kpi.hot b { color: var(--bad); } .kpi.warn b { color: var(--warn); } .kpi.good b { color: var(--ok); }
  /* corpo */
  #body { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 320px; gap: 14px; }
  #cols { display: flex; gap: 10px; overflow-x: auto; min-height: 0; padding-bottom: 6px; }
  .col { flex: 0 0 250px; display: flex; flex-direction: column; min-height: 0; background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
  .col.over { border-color: var(--blue); background: rgba(10,132,255,.1); }
  .col h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .col h2 i { margin-left: auto; font-style: normal; background: var(--glass2); border-radius: 999px; padding: 1px 7px; font-size: 10.5px; color: #d5d5da; }
  .cards { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 7px; scrollbar-width: none; }
  .card { background: rgba(255,255,255,.08); border: 1px solid transparent; border-radius: 14px; padding: 9px 10px; cursor: grab; }
  .card:hover { background: rgba(255,255,255,.13); } .card.mine { border-color: rgba(10,132,255,.45); }
  .card.blocked { border-color: rgba(255,69,58,.5); background: rgba(255,69,58,.08); }
  .card.stale { box-shadow: inset 3px 0 0 var(--warn); }
  .card.focusing { border-color: var(--blue); background: linear-gradient(135deg, rgba(10,132,255,.2), rgba(255,255,255,.07)); }
  .card .n { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .card .t { font-size: 12.5px; font-weight: 600; line-height: 1.3; margin: 2px 0 5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 3px; background: rgba(255,255,255,.1); border-radius: 999px; padding: 1.5px 7px; font-size: 10px; color: #d5d5da; }
  .chip svg { width: 10px; height: 10px; }
  .chip.bug { background: rgba(255,69,58,.2); color: #ffb4ae; } .chip.ideia { background: rgba(191,90,242,.2); color: #e5c2ff; }
  .chip.dono { background: rgba(10,132,255,.2); color: #b9dbff; } .chip.sem { background: rgba(255,159,10,.2); color: #ffd79a; }
  .card .acts { display: flex; gap: 5px; margin-top: 7px; opacity: 0; transition: opacity .15s; }
  .card:hover .acts, .card.focusing .acts { opacity: 1; }
  .card .acts button { flex: 1; padding: 4px 0; font-size: 10.5px; border-radius: 8px; }
  .card .acts button.go { background: var(--blue); color: #fff; } .card .acts button.go.on { background: var(--bad); }
  /* lateral */
  #side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .panel { background: var(--glass); border: 1px solid var(--line); border-radius: 18px; padding: 13px; min-height: 0; display: flex; flex-direction: column; }
  .panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 9px; display: flex; align-items: center; gap: 6px; }
  .panel h3 svg { width: 13px; height: 13px; } .panel h3 .sp { flex: 1; }
  .who { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .who:last-child { border: 0; } .av { width: 26px; height: 26px; border-radius: 50%; background: var(--glass2); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: 0 0 26px; }
  .who .nm { font-size: 12px; font-weight: 600; } .who .st { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .who .live { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px rgba(48,209,88,.7); flex: 0 0 7px; }
  .who .wip { font-size: 10.5px; background: var(--glass2); border-radius: 999px; padding: 1px 7px; } .who .wip.over { background: rgba(255,159,10,.25); color: #ffd79a; }
  #feed { flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; gap: 2px; scrollbar-width: none; }
  .ev { display: flex; gap: 7px; padding: 5px 0; font-size: 11.5px; line-height: 1.35; border-bottom: 1px solid rgba(255,255,255,.04); }
  .ev .ic { width: 18px; flex: 0 0 18px; text-align: center; opacity: .85; }
  .ev b { font-weight: 600; } .ev .tm { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; }
  .alert { display: flex; gap: 7px; align-items: flex-start; background: rgba(255,159,10,.12); border: 1px solid rgba(255,159,10,.3); border-radius: 12px; padding: 8px 10px; font-size: 11.5px; margin-bottom: 6px; cursor: pointer; }
  .alert.bad { background: rgba(255,69,58,.12); border-color: rgba(255,69,58,.35); }
  .empty { text-align: center; color: var(--muted); padding: 22px 8px; font-size: 11.5px; }
  /* arrasto por ponteiro */
  .card.ghost { position: fixed; z-index: 50; pointer-events: none; opacity: .92; transform: rotate(-2deg) scale(1.03); box-shadow: 0 24px 60px rgba(0,0,0,.6); border-color: var(--blue); }
  .card.lifting { opacity: .35; } body.dragging { cursor: grabbing; } body.dragging .card { cursor: grabbing; }
  .col.over { border-color: var(--blue) !important; background: rgba(10,132,255,.14) !important; }
  /* detalhes do cartão */
  #modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; } #modal[hidden] { display: none; }
  #mBack { position: absolute; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); }
  #mCard { position: relative; width: min(920px, calc(100vw - 60px)); max-height: calc(100vh - 70px); overflow: auto; padding: 18px 20px; border-radius: 22px; }
  .mhead { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 12px; } .mhead > div { flex: 1; min-width: 0; }
  .mhead .mn { font-size: 11px; color: var(--muted); } .mhead h2 { font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin: 2px 0 8px; line-height: 1.25; }
  .mchips { display: flex; gap: 5px; flex-wrap: wrap; } .mchips .chip { font-size: 10.5px; }
  .mgrid { display: grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; }
  .msec { margin-bottom: 12px; } .msec h4 { font-size: 10.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin-bottom: 5px; }
  .msec > div { font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; user-select: text; }
  .mmsg { background: rgba(255,255,255,.06); border-radius: 10px; padding: 7px 9px; margin-bottom: 5px; font-size: 12px; white-space: normal; }
  .mright { background: rgba(0,0,0,.22); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  .mrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,.05); }
  .mrow span { color: var(--muted); } .mrow b { font-weight: 600; text-align: right; } .mrow select { max-width: 170px; font-size: 12px; padding: 5px 8px; }
  .macts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; } .macts button { flex: 1 1 45%; font-size: 12px; }
  .mhist { max-height: 200px; overflow: auto; } .mh { font-size: 11px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.04); line-height: 1.3; } .mh span { color: var(--muted); margin-right: 6px; font-variant-numeric: tabular-nums; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.62); border: 1px solid var(--line); border-radius: 999px; padding: 7px 16px; font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }

  /* vidro compartilhado */
  .panel, .col { position: relative; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.10);
    backdrop-filter: blur(26px) saturate(1.7); box-shadow: 0 18px 46px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.2); }
  .panel::before, .col::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(320px 190px at var(--gx,50%) var(--gy,0%), rgba(255,255,255,.09), transparent 62%); }
  .panel > *, .col > * { position: relative; }
  button { background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.07)); border: 1px solid rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 2px 8px rgba(0,0,0,.22); }
  button.pri { background: linear-gradient(180deg, #3ba0ff, #0a84ff); border-color: rgba(255,255,255,.25); }
  .kpi { background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.05)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22); backdrop-filter: blur(18px) saturate(1.5); }
  .card, .row { box-shadow: inset 0 1px 0 rgba(255,255,255,.12); }


  /* rolagem sem barra: continua rolando (roda do mouse), mas nada de trilho cinza na tela */
  html, body, div, section, main, aside, ul, ol, pre, textarea { scrollbar-width: none !important; -ms-overflow-style: none !important; }
  ::-webkit-scrollbar { width: 0 !important; height: 0 !important; display: none !important; }
  ::-webkit-scrollbar-thumb, ::-webkit-scrollbar-track { display: none !important; }
</style>
</head>
<body>
<div id="drag"></div>
<div id="app">
  <header>
    <h1>Quadro · Sistemas</h1>
    <div class="seg" id="modes"><button data-m="col" class="on">Colunas</button><button data-m="who">Por pessoa</button></div>
    <input id="q" placeholder="Buscar cartão…" style="width:180px">
    <select id="fTrilha"><option value="">Bugs e ideias</option><option value="bug">Só bugs</option><option value="ideia">Só ideias</option></select>
    <select id="fDono"><option value="">Todos</option><option value="me">Meus</option><option value="none">Sem dono</option></select>
    <span class="sp"></span>
    <button id="brief" title="Envia agora, como notificação no topo da tela, o resumo do quadro: o que entrou, o que está sem dono, o que travou e o que foi entregue. Sai sozinho às 9h e às 18h.">Resumo do dia</button>
    <button id="reload" class="pri">Atualizar</button>
  </header>
  <div id="stats"></div>
  <div id="body">
    <div id="cols"></div>
    <div id="side">
      <div class="panel" style="flex:0 0 auto"><h3>Agora <span class="sp"></span><span class="muted" id="wipLbl"></span></h3><div id="who"></div></div>
      <div class="panel" style="flex:0 0 auto"><h3>Travas</h3><div id="alerts"></div></div>
      <div class="panel" style="flex:1"><h3>Movimentação do time</h3><div id="feed"></div></div>
    </div>
  </div>
</div>
<div id="modal" hidden><div id="mBack"></div><div id="mCard" class="panel"><div id="mBody"></div></div></div>
<div id="toast"></div>
<script src="iconsax.js"></script>
<script>
const api = window.sidenotch; const IX = window.IX || {};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (new URLSearchParams(location.search).get('solid')) document.body.classList.add('solid');
const COLS = [['recebida', 'Recebidas'], ['em_triagem', 'Triagem'], ['em_priorizacao', 'Priorização'], ['aprovada', 'Aprovadas'], ['em_desenvolvimento', 'Em desenvolvimento'], ['entregue', 'Entregue']];
const EV_IC = { assumiu: '✋', mudou_status: '➜', bloqueou: '⛔', desbloqueou: '✅', comentou: '💬', criou: '✨', entregou: '🚀' };
const COL_N = Object.fromEntries(COLS);
const mmss = (s) => `${String(Math.floor(Math.max(0, s) / 60)).padStart(2, '0')}:${String(Math.round(Math.max(0, s) % 60)).padStart(2, '0')}`;
const initials = (n) => String(n || '?').split(/\s+/).slice(0, 2).map((x) => x[0]).join('').toUpperCase();
const ago = (d) => { const s = (Date.now() - new Date(d).getTime()) / 1000; if (s < 60) return 'agora'; if (s < 3600) return Math.floor(s / 60) + ' min'; if (s < 86400) return Math.floor(s / 3600) + ' h'; return Math.floor(s / 86400) + ' d'; };

let board = null, feed = [], alerts = null, fx = { active: false }, me = null, mode = 'col', q = '', fTrilha = '', fDono = '', drag = null;
function toast(t) { const el = $('#toast'); el.textContent = t; el.style.opacity = 1; clearTimeout(el._t); el._t = setTimeout(() => el.style.opacity = 0, 1800); }
const cards = () => ((board && board.cards) || []).filter((c) => {
  if (fTrilha && c.trilha !== fTrilha) return false;
  if (fDono === 'me' && c.responsavel_id !== me) return false;
  if (fDono === 'none' && c.responsavel_id) return false;
  if (q && !(`${c.numero_sequencial} ${c.titulo} ${c.responsavel_nome || ''} ${c.autor_nome || ''}`.toLowerCase().includes(q.toLowerCase()))) return false;
  return true;
});

function renderStats() {
  const s = (board && board.stats) || {};
  const kpis = [
    ['total', 'na fila', ''], ['semDono', 'sem dono', s.semDono ? 'warn' : ''], ['emDev', 'em dev', ''],
    ['paradas', 'paradas', s.paradas ? 'hot' : ''], ['bloqueadas', 'bloqueadas', s.bloqueadas ? 'hot' : ''],
    ['novas24h', 'novas 24h', ''], ['entregues7d', 'entregues 7d', s.entregues7d ? 'good' : '']
  ];
  $('#stats').innerHTML = kpis.map(([k, lbl, cls]) => `<div class="kpi ${cls}"><b>${s[k] ?? 0}</b><span>${lbl}</span></div>`).join('');
}
function cardHtml(c) {
  const on = fx.active && fx.taskId === c.id;
  const stale = c.status === 'em_desenvolvimento' && new Date(c.ultimo_evento_em || c.updated_at || c.created_at).getTime() < Date.now() - 2 * 86400000;
  const dias = Math.floor((Date.now() - new Date(c.ultimo_evento_em || c.updated_at || c.created_at).getTime()) / 86400000);
  return `<div class="card ${c.responsavel_id === me ? 'mine' : ''} ${c.bloqueado ? 'blocked' : ''} ${stale ? 'stale' : ''} ${on && fx.running ? 'focusing' : ''}" data-id="${esc(c.id)}">
    <div class="n">#${c.numero_sequencial}${c.autor_nome ? ' · ' + esc(String(c.autor_nome).split(' ')[0]) : ''}${c.modulo_slug ? ' · ' + esc(c.modulo_slug) : ''}</div>
    <div class="t">${esc(c.titulo)}</div>
    <div class="meta">
      <span class="chip ${c.trilha === 'bug' ? 'bug' : 'ideia'}">${c.trilha === 'bug' ? 'bug' : 'ideia'}${c.severidade ? ' · ' + esc(c.severidade) : ''}</span>
      ${c.responsavel_id ? `<span class="chip dono">${esc(String(c.responsavel_nome || '').split(' ')[0] || 'dono')}</span>` : '<span class="chip sem">sem dono</span>'}
      ${c.bloqueado ? `<span class="chip bug">⛔ ${esc((c.bloqueio_motivo || '').slice(0, 24))}</span>` : ''}
      ${stale ? `<span class="chip sem">${dias}d sem evento</span>` : ''}
      ${c.focus_seconds ? `<span class="chip">${Math.round(c.focus_seconds / 60)}m</span>` : ''}
      ${on ? `<span class="chip dono">⏱ ${mmss(fx.remaining)}</span>` : ''}
    </div>
    <div class="acts">
      <button class="go ${on && fx.running ? 'on' : ''}" data-go="${esc(c.id)}">${on && fx.running ? 'Pausar' : c.responsavel_id === me ? 'Focar' : 'Assumir'}</button>
      ${c.status === 'em_desenvolvimento' ? `<button data-done="${esc(c.id)}">Entregar</button>` : ''}
      <button data-blk="${esc(c.id)}">${c.bloqueado ? 'Liberar' : 'Travar'}</button>
    </div></div>`;
}
function renderBoard() {
  const list = cards();
  if (mode === 'col') {
    $('#cols').innerHTML = COLS.map(([st, nome]) => {
      const cs = list.filter((c) => c.status === st);
      return `<div class="col" data-col="${st}"><h2>${nome}<i>${cs.length}</i></h2><div class="cards">${cs.map(cardHtml).join('') || '<div class="empty">vazio</div>'}</div></div>`;
    }).join('');
  } else {
    const people = (board && board.people) || [];
    const semDono = list.filter((c) => !c.responsavel_id);
    $('#cols').innerHTML = [
      `<div class="col" data-person=""><h2>Sem dono<i>${semDono.length}</i></h2><div class="cards">${semDono.map(cardHtml).join('') || '<div class="empty">tudo com dono 🎉</div>'}</div></div>`,
      ...people.map((p) => {
        const cs = list.filter((c) => c.responsavel_id === p.id);
        return `<div class="col" data-person="${esc(p.id)}"><h2>${esc(p.name || '—')}<i>${cs.length}</i></h2><div class="cards">${cs.map(cardHtml).join('') || '<div class="empty">solte um cartão aqui</div>'}</div></div>`;
      })
    ].join('');
  }
  bindCards();
  renderStats();
}
function renderWho() {
  const people = (board && board.people) || []; const now = (board && board.now) || [];
  const wipLimit = 2;
  $('#wipLbl').textContent = people.length ? `${people.reduce((a, p) => a + (p.wip || 0), 0)} em mãos` : '';
  $('#who').innerHTML = people.length ? people.map((p) => {
    const live = now.find((n) => n.userId === p.id);
    return `<div class="who">${live ? '<span class="live"></span>' : '<span class="live" style="background:#48484e;box-shadow:none"></span>'}
      <span class="av">${initials(p.name)}</span>
      <div class="grow"><div class="nm">${esc(String(p.name || '').split(' ').slice(0, 2).join(' '))}</div>
      <div class="st">${live ? '⏱ ' + esc(String(live.title || '').slice(0, 30)) + ' · ' + Math.round((live.seconds || 0) / 60) + ' min' : (p.focusToday ? Math.round(p.focusToday / 60) + ' min hoje' : 'sem foco hoje')}</div></div>
      <span class="wip ${p.wip > wipLimit ? 'over' : ''}">${p.wip || 0}</span></div>`;
  }).join('') : '<div class="empty">Sem gente no setor.</div>';
}
function renderAlerts() {
  const a = alerts || {}; const out = [];
  const push = (cls, txt, id) => out.push(`<div class="alert ${cls}" ${id ? `data-jump="${esc(id)}"` : ''}>${txt}</div>`);
  (a.semDono || []).length && push('', `⏳ <b>${a.semDono.length}</b> sem dono há +24h — ${esc(a.semDono.slice(0, 2).map((x) => '#' + x.n).join(', '))}`);
  for (const x of (a.paradas || []).slice(0, 3)) push('bad', `🛑 <b>#${x.n}</b> parada há ${x.dias}d${x.quem ? ' · ' + esc(String(x.quem).split(' ')[0]) : ''}`, x.id);
  for (const x of (a.bloqueadas || []).slice(0, 3)) push('bad', `⛔ <b>#${x.n}</b> ${esc((x.motivo || 'sem motivo').slice(0, 40))}`, x.id);
  for (const x of (a.sla || []).slice(0, 3)) push('bad', `⚠ SLA de ${x.tipo} — <b>#${x.n}</b>`, x.id);
  for (const w of (a.wip || [])) push('', `📌 <b>${esc(String(w.name).split(' ')[0])}</b> com ${w.wip} em andamento`);
  a.filaNova && push('', `📥 <b>${a.filaNova}</b> nova(s) na fila nas últimas 24h`);
  $('#alerts').innerHTML = out.join('') || '<div class="empty">Nada travado. 👌</div>';
  document.querySelectorAll('[data-jump]').forEach((el) => el.onclick = () => { q = '#'; const c = ((board && board.cards) || []).find((x) => x.id === el.dataset.jump); if (c) { q = String(c.numero_sequencial); $('#q').value = q; renderBoard(); } });
}
function renderFeed() {
  $('#feed').innerHTML = (feed || []).length ? feed.slice(0, 40).map((e) => {
    const ic = EV_IC[e.acao] || '•';
    const alvo = e.numero_sequencial || e.numero ? `#${e.numero_sequencial || e.numero}` : '';
    const para = e.para && e.para.status ? ` → <b>${COL_N[e.para.status] || e.para.status}</b>` : '';
    const tit = e.titulo ? ' ' + esc(String(e.titulo).slice(0, 34)) : '';
    return `<div class="ev"><span class="ic">${ic}</span><div class="grow"><b>${esc(String(e.usuario_nome || e.quem || '—').split(' ')[0])}</b> ${esc(e.acao === 'mudou_status' ? 'moveu' : e.acao)} ${alvo}${tit}${para}</div><span class="tm">${ago(e.created_at || e.at)}</span></div>`;
  }).join('') : '<div class="empty">Sem movimento ainda hoje.</div>';
}
function bindCards() {
  document.querySelectorAll('[data-go]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); const id = b.dataset.go; const c = ((board && board.cards) || []).find((x) => x.id === id);
    b.disabled = true;
    fx = await api.focusToggle({ id, title: c ? `#${c.numero_sequencial} ${c.titulo}` : 'Cartão', kind: 'ideia' }) || fx;
    await load(true);
  });
  document.querySelectorAll('[data-done]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); b.disabled = true; const r = await api.boardMove(b.dataset.done, 'entregue');
    if (!r.ok) { toast(r.error); b.disabled = false; return; } toast('Entregue 🚀'); await load(true);
  });
  document.querySelectorAll('[data-blk]').forEach((b) => b.onclick = async (e) => {
    e.stopPropagation(); const id = b.dataset.blk; const c = ((board && board.cards) || []).find((x) => x.id === id);
    if (c && c.bloqueado) { const r = await api.boardBlock(id, false); if (!r.ok) toast(r.error); else toast('Liberado.'); return load(true); }
    const motivo = prompt('O que está travando esse cartão?'); if (!motivo) return;
    const r = await api.boardBlock(id, true, motivo); if (!r.ok) { toast(r.error); return; } toast('Travado — o time é avisado.'); await load(true);
  });
  // arrastar por ponteiro: fantasma segue o cursor; soltar numa coluna move, soltar numa pessoa atribui
  document.querySelectorAll('.card[data-id]').forEach((el) => {
    el.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || e.target.closest('button, a, input, select')) return;
      const id = el.dataset.id; const start = { x: e.clientX, y: e.clientY }; let ghost = null, lastCol = null;
      const move = (ev) => {
        if (!ghost) {
          if (Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 6) return;
          ghost = el.cloneNode(true); ghost.className = 'card ghost'; ghost.style.width = el.getBoundingClientRect().width + 'px';
          document.body.appendChild(ghost); el.classList.add('lifting'); document.body.classList.add('dragging');
        }
        ghost.style.left = (ev.clientX + 12) + 'px'; ghost.style.top = (ev.clientY - 10) + 'px';
        const under = document.elementFromPoint(ev.clientX, ev.clientY); const col = under && under.closest('.col');
        if (col !== lastCol) { if (lastCol) lastCol.classList.remove('over'); if (col) col.classList.add('over'); lastCol = col; }
      };
      const up = async (ev) => {
        document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up);
        if (!ghost) { openCard(id); return; }             // clique simples abre os detalhes
        ghost.remove(); el.classList.remove('lifting'); document.body.classList.remove('dragging');
        if (lastCol) lastCol.classList.remove('over');
        const under = document.elementFromPoint(ev.clientX, ev.clientY); const col = under && under.closest('.col'); if (!col) return;
        const c = ((board && board.cards) || []).find((x) => x.id === id); if (!c) return;
        if (col.dataset.col) {                              // coluna de status
          const st = col.dataset.col; if (c.status === st) return;
          const r = await api.boardMove(id, st); if (!r.ok) { toast(r.error); return; }
          toast(`#${c.numero_sequencial} → ${COL_N[st]}`); await load(true);
        } else if (col.dataset.person !== undefined) {      // raia de pessoa
          const uid = col.dataset.person || null; if ((c.responsavel_id || null) === uid) return;
          const r = await api.boardAssign(id, uid, false); if (!r.ok) { toast(r.error); return; }
          toast(uid ? `#${c.numero_sequencial} atribuído` : `#${c.numero_sequencial} sem dono`); await load(true);
        }
      };
      document.addEventListener('pointermove', move); document.addEventListener('pointerup', up);
    });
  });
}

// ---------- detalhes do cartão ----------
const PRI_N = { baixa: 'Baixa', media: 'Média', alta: 'Alta', critica: 'Crítica' };
let modalId = null;
async function openCard(id) {
  modalId = id; const m = $('#modal'); m.hidden = false; $('#mBody').innerHTML = '<div class="empty">Carregando…</div>';
  const r = await api.boardCard(id);
  if (!r.ok || !r.data || !r.data.card) { $('#mBody').innerHTML = `<div class="empty">${esc((r && r.error) || 'Não achei o cartão')}</div>`; return; }
  renderCard(r.data);
}
function renderCard(d) {
  const c = d.card, people = d.people || [], hist = d.history || [], msgs = d.messages || [];
  const on = fx.active && fx.taskId === c.id;
  const dt = (v) => v ? new Date(v).toLocaleString('pt-BR', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }).replace('.', '') : '—';
  const sec = (t, html) => html ? `<div class="msec"><h4>${t}</h4><div>${html}</div></div>` : '';
  $('#mBody').innerHTML = `
    <div class="mhead"><div><div class="mn">#${c.numero_sequencial} · ${esc(c.trilha === 'bug' ? 'Bug' : 'Ideia')}${c.modulo_slug ? ' · ' + esc(c.modulo_slug) : ''}</div><h2>${esc(c.titulo)}</h2>
      <div class="mchips"><span class="chip ${c.trilha === 'bug' ? 'bug' : 'ideia'}">${esc(COL_N[c.status] || c.status)}</span>
        ${c.severidade ? `<span class="chip">sev. ${esc(c.severidade)}</span>` : ''}${c.prioridade ? `<span class="chip">${esc(PRI_N[c.prioridade] || c.prioridade)}</span>` : ''}
        ${c.bloqueado ? `<span class="chip bug">⛔ ${esc(c.bloqueio_motivo || 'travado')}</span>` : ''}${c.estimativa_horas ? `<span class="chip">${c.estimativa_horas} h est.</span>` : ''}
        ${c.focus_seconds ? `<span class="chip">${Math.round(c.focus_seconds / 60)} min focados</span>` : ''}${c.sla_resolucao_estourado_em || c.sla_resposta_estourado_em ? '<span class="chip bug">SLA estourado</span>' : ''}</div></div>
      <button class="icon" id="mClose" title="Fechar (Esc)">✕</button></div>
    <div class="mgrid">
      <div class="mleft">
        ${sec('Descrição', c.descricao ? esc(c.descricao) : '')}${sec('Problema', c.problema ? esc(c.problema) : '')}${sec('Proposta', c.proposta ? esc(c.proposta) : '')}${sec('Benefício esperado', c.beneficio_esperado ? esc(c.beneficio_esperado) : '')}
        ${!c.descricao && !c.problema && !c.proposta ? '<div class="muted" style="font-size:12px">Sem descrição.</div>' : ''}
        ${msgs.length ? sec('Últimas mensagens', msgs.map((m) => `<div class="mmsg"><b>${esc(m.quem || '—')}</b> <span class="muted">${dt(m.at)}</span><div>${esc(m.texto || '')}</div></div>`).join('')) : ''}
      </div>
      <div class="mright">
        <div class="mrow"><span>Responsável</span><select id="mWho"><option value="">— sem dono —</option>${people.map((p) => `<option value="${p.id}" ${p.id === c.responsavel_id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="mrow"><span>Coluna</span><select id="mCol">${COLS.map(([st, n]) => `<option value="${st}" ${st === c.status ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="mrow"><span>Autor</span><b>${esc(c.autor_nome || '—')}${c.autor_setor_slug ? ' · ' + esc(c.autor_setor_slug) : ''}</b></div>
        <div class="mrow"><span>Criado</span><b>${dt(c.created_at)}</b></div>
        <div class="mrow"><span>Última atividade</span><b>${dt(c.updated_at)}</b></div>
        ${c.entregue_em ? `<div class="mrow"><span>Entregue</span><b>${dt(c.entregue_em)}</b></div>` : ''}
        <div class="macts">
          <button class="pri" id="mFocus">${on && fx.running ? 'Pausar foco' : c.responsavel_id === me ? 'Focar' : 'Assumir e focar'}</button>
          ${c.status !== 'entregue' ? '<button id="mDone">Entregar</button>' : ''}
          <button id="mBlock">${c.bloqueado ? 'Liberar' : 'Travar'}</button>
          <button id="mHub">Abrir no Hub</button>
        </div>
        <div class="msec"><h4>Histórico</h4><div class="mhist">${hist.length ? hist.map((h) => `<div class="mh"><span>${dt(h.at)}</span><b>${esc(String(h.quem || '—').split(' ')[0])}</b> ${esc(h.acao === 'mudou_status' ? 'moveu' : h.acao)}${h.para && h.para.status ? ' → ' + esc(COL_N[h.para.status] || h.para.status) : ''}${h.para && h.para.responsavel_nome ? ' → ' + esc(h.para.responsavel_nome) : ''}${h.detalhes && !/via SideNotch/.test(h.detalhes) ? ' · ' + esc(String(h.detalhes).slice(0, 60)) : ''}</div>`).join('') : '<div class="muted">Sem eventos.</div>'}</div></div>
      </div>
    </div>`;
  $('#mClose').onclick = closeCard;
  $('#mWho').onchange = async () => { const uid = $('#mWho').value || null; const r = await api.boardAssign(c.id, uid, false); if (!r.ok) { toast(r.error); return; } toast(uid ? 'Atribuído.' : 'Sem dono.'); await load(true); openCard(c.id); };
  $('#mCol').onchange = async () => { const st = $('#mCol').value; const r = await api.boardMove(c.id, st); if (!r.ok) { toast(r.error); return; } toast(`→ ${COL_N[st]}`); await load(true); openCard(c.id); };
  $('#mFocus').onclick = async () => { fx = await api.focusToggle({ id: c.id, title: `#${c.numero_sequencial} ${c.titulo}`, kind: 'ideia' }) || fx; await load(true); openCard(c.id); };
  const dn = $('#mDone'); if (dn) dn.onclick = async () => { const r = await api.boardMove(c.id, 'entregue'); if (!r.ok) { toast(r.error); return; } toast('Entregue 🚀'); await load(true); openCard(c.id); };
  $('#mBlock').onclick = async () => {
    if (c.bloqueado) { const r = await api.boardBlock(c.id, false); if (!r.ok) toast(r.error); await load(true); return openCard(c.id); }
    const motivo = prompt('O que está travando esse cartão?'); if (!motivo) return;
    const r = await api.boardBlock(c.id, true, motivo); if (!r.ok) { toast(r.error); return; } await load(true); openCard(c.id);
  };
  $('#mHub').onclick = () => api.hubOpen(`/sistemas/ideias?id=${c.id}`);
}
function closeCard() { modalId = null; $('#modal').hidden = true; }

async function load(force) {
  const r = await api.boardGet(!!force);
  if (!r) { $('#cols').innerHTML = '<div class="empty">Você não tem o módulo Sistemas no Hub.</div>'; return; }
  board = r.board; feed = r.feed || []; alerts = r.alerts || alerts;
  renderBoard(); renderWho(); renderFeed(); renderAlerts();
}
document.querySelectorAll('[data-m]').forEach((b) => b.onclick = () => { mode = b.dataset.m; document.querySelectorAll('[data-m]').forEach((x) => x.classList.toggle('on', x === b)); renderBoard(); });
$('#q').oninput = () => { q = $('#q').value.trim(); renderBoard(); };
$('#fTrilha').onchange = () => { fTrilha = $('#fTrilha').value; renderBoard(); };
$('#fDono').onchange = () => { fDono = $('#fDono').value; renderBoard(); };
$('#reload').onclick = async () => { const a = await api.boardAlerts(); if (a) alerts = a; await load(true); toast('Atualizado.'); };
$('#brief').onclick = async () => { await api.boardBrief(new Date().getHours() >= 14 ? 'tarde' : 'manha'); toast('Resumo enviado — aparece no banner do topo.'); };
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (modalId) closeCard(); else window.close(); } if (e.key === '/' && e.target !== $('#q')) { e.preventDefault(); $('#q').focus(); } });
$('#mBack').onclick = closeCard;

api.onHub((h) => { if (!h) return; me = h.profile && h.profile.id || me; if (h.board) { board = h.board; feed = h.boardFeed || feed; alerts = h.boardAlerts || alerts; renderBoard(); renderWho(); renderFeed(); renderAlerts(); } });
api.onFocus((st) => { if (st) { fx = st; renderBoard(); } });
(async () => {
  const h = await api.hubGet(); me = (h && h.profile && h.profile.id) || null;
  fx = await api.focusGet() || fx;
  const a = await api.boardAlerts().catch(() => null); if (a) alerts = a;
  await load(true);
  setInterval(() => load(false), 60000);
})();
</script>
